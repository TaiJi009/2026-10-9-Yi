name: 校验

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# job 名必须叫 `check`：main 的 ruleset（protect-main）把 required_status_checks
# 写死成这个 context。改名或拆成多个 job 会让 PR 永远停在 BLOCKED。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # —— 约束哨兵：CLAUDE.md 软约束的硬版本，违者红（报错信息即修复指引）——
      - name: 约束哨兵
        run: |
          # AGENTS.md 必须是指向 CLAUDE.md 的符号链接（多 harness 共用一份真源）
          [ -L AGENTS.md ] || { echo "错误：AGENTS.md 必须是指向 CLAUDE.md 的符号链接"; exit 1; }
          [ "$(readlink AGENTS.md)" = "CLAUDE.md" ] \
            || { echo "错误：AGENTS.md 应指向 CLAUDE.md，当前指向 $(readlink AGENTS.md)"; exit 1; }
          # 记忆文件封顶：膨胀会稀释遵循度，新约束优先合并旧条目或拆去 docs/agents/
          lines=$(wc -l < CLAUDE.md | tr -d ' ')
          [ "$lines" -le 120 ] \
            || { echo "错误：CLAUDE.md 已 ${lines} 行（上限 120）——精简合并，或拆到 docs/agents/、README"; exit 1; }
          # core/ 纯逻辑：禁止 DOM / 浏览器全局（vitest 跑 node 环境，无 jsdom）
          if grep -rnE 'document\.|window\.|navigator\.|querySelector' frontend/src/core --include='*.ts'; then
            echo "错误：core/ 出现 DOM / 浏览器 API —— 移到 anim/ 或控制器层"; exit 1
          fi
          # 依赖方向哨兵（架构五规则之二：禁止的依赖必须机械失败）
          # 方向：core ← state ← anim ← grow|stage|plays ← screens/components ← App
          deperr=0
          grep -rnE "from ['\"]\.\./(state|anim|grow|stage|plays|screens|components|util|App)" frontend/src/core --include='*.ts' \
            && { echo "错误：core/ 是纯逻辑层，禁止 import 任何上层目录"; deperr=1; }
          grep -rnE "from ['\"]\.\./(anim|grow|stage|plays|screens|components|App)" frontend/src/state --include='*.ts' \
            && { echo "错误：state/ 只许依赖 core/"; deperr=1; }
          grep -rnE "from ['\"]\.\./(state|grow|stage|plays|screens|components|App)" frontend/src/anim --include='*.ts' \
            && { echo "错误：anim/ 只许依赖 core/（它不认识业务语义）"; deperr=1; }
          grep -rnE "from ['\"]\.\./(screens|components|App)" frontend/src/grow frontend/src/stage frontend/src/plays --include='*.ts' \
            && { echo "错误：grow|stage|plays 收 ref 操作容器，不许 import screens|components"; deperr=1; }
          [ "$deperr" -eq 0 ] || exit 1

      # —— 前端 ——
      - name: 安装前端依赖
        run: npm ci
        working-directory: frontend

      - name: 前端单元测试
        run: npm run test:run
        working-directory: frontend

      - name: 前端构建
        run: npm run build
        working-directory: frontend

      - name: 校验产物子路径
        run: |
          grep -q '/2026-10-9-Yi/' frontend/dist/index.html \
            || { echo "错误：dist/index.html 缺少 /2026-10-9-Yi/ —— Vite base 没生效，Pages 子路径会 404"; exit 1; }

      # —— 后端 ——
      - name: 安装后端依赖
        run: npm ci
        working-directory: backend

      - name: 后端冒烟测试
        run: npm test
        working-directory: backend

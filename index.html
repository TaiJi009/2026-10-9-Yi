<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>演易</title>
<style>
/* ==========================================================================
   TOKENS —— 明度阶梯（tone ramp）与节奏常量
   全站仅用黑白灰，靠明度分层承载语义。
   ========================================================================== */
:root{
  --t0:#06060a; --t1:#0c0c11; --t2:#15151b; --t3:#212128; --t4:#32323b;
  --t5:#4a4a55; --t6:#6c6c78; --t7:#9898a6; --t8:#c8c8d4; --t9:#ececf3; --w:#fff;

  --ink:#8f8f9c;        /* 静爻 */
  --ink-hi:#e8e8ef;     /* 落定爻 */
  --ink-max:#ffffff;    /* 动爻 */

  --ease-settle:cubic-bezier(.4,0,.2,1);

  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-cn:"Songti SC","STSong","Noto Serif SC",Georgia,serif;

  --ygap:12px; --yh:15px; --yw:170px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--t0);color:var(--t8);font-family:var(--font-ui);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
/* 极淡网格 + 中心暗角，给"虚空"一点质感 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:64px 64px, 64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 18%, transparent 76%);
  mask-image:radial-gradient(circle at 50% 50%, #000 18%, transparent 76%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 50%, transparent 28%, rgba(0,0,0,.74) 100%);
}

/* ==========================================================================
   LAYOUT —— 舞台与六屏
   ========================================================================== */
#stage{position:fixed;inset:0;z-index:1}
.screen{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;padding:24px;
  transition:opacity .42s var(--ease-settle);
}
.screen.active{opacity:1;pointer-events:auto}

.hint{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  font-size:12px;letter-spacing:.32em;color:var(--t6);white-space:nowrap;
}
.hint b{color:var(--t8);font-weight:400}

/* ==========================================================================
   YAO —— 全站唯一的图形原子
   阳爻 = 两段 scaleX(1) 拼成实线；阴爻 = 两段 scaleX(.88)，中缝裂开。
   翻爻只 morph scaleX，无 DOM 交换、无 reflow。
   ========================================================================== */
.stack{display:flex;flex-direction:column-reverse;gap:var(--ygap);width:var(--yw)}
.yao{position:relative;width:100%;height:var(--yh);flex:none}
.yao .seg{position:absolute;top:0;height:100%;width:50%;background:var(--ink);border-radius:1px}
.yao .seg-l{left:0;transform-origin:0 50%}
.yao .seg-r{left:50%;transform-origin:100% 50%}
.yao[data-yang="0"] .seg{transform:scaleX(.88)}

.yao .glow{
  position:absolute;inset:-4px -3px;border-radius:3px;
  background:var(--ink-max);filter:blur(5px);opacity:0;pointer-events:none;
}
.yao .mark{
  position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);
  font-family:var(--font-cn);font-size:14px;line-height:1;color:var(--ink-max);opacity:0;
  letter-spacing:0;
}
.yao[data-moving="1"] .mark{opacity:.9}

.yao[data-ghost="1"]{opacity:.16}

.stack[data-phase="settled"] .yao[data-moving="0"] .seg{background:var(--ink-hi)}
.stack[data-phase="settled"] .yao[data-moving="1"] .seg{background:var(--ink-max)}
.stack[data-phase="settled"] .yao[data-moving="1"] .glow{opacity:.55;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.78}}

/* 高亮档 —— 错综页演算时用 */
.yao[data-hot="hot"] .seg{background:var(--ink-max)}
.yao[data-hot="hot"] .glow{opacity:.7}
.yao[data-hot="dim"] .seg{background:var(--t3)}
.yao[data-hot="kept"] .seg{background:var(--w);box-shadow:0 0 11px rgba(255,255,255,.32)}
.yao[data-hot="grpA"] .seg,
.yao[data-hot="grpB"] .seg{background:var(--w);box-shadow:0 0 11px rgba(255,255,255,.32)}
.yao[data-hot="grpA"]::after,
.yao[data-hot="grpB"]::after{
  content:"";position:absolute;left:-9px;right:-9px;top:-5px;bottom:-5px;
  border:1px solid rgba(255,255,255,.45);border-radius:2px;
  animation:grpPulse .95s ease-in-out infinite;
}
.yao[data-hot="grpB"]::after{border-style:dashed}
@keyframes grpPulse{0%,100%{opacity:.42}50%{opacity:1}}

/* ==========================================================================
   SCREEN 0 —— 静 · 太极
   ========================================================================== */
.taiji{
  width:238px;height:238px;position:relative;z-index:2;
  cursor:pointer;outline:none;display:block;
  filter:drop-shadow(0 0 26px rgba(255,255,255,.14));
  animation:taijiBreathe 5.2s ease-in-out infinite;
}
@keyframes taijiBreathe{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(255,255,255,.10))}
  50%{transform:scale(1.04);filter:drop-shadow(0 0 40px rgba(255,255,255,.22))}
}
#rest .halo{
  position:absolute;width:380px;height:380px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,.085) 0%, transparent 68%);
  animation:haloBreathe 5.2s ease-in-out infinite;
}
@keyframes haloBreathe{0%,100%{opacity:.55}50%{opacity:1}}
.taiji svg{width:100%;height:100%;display:block;border-radius:50%}

/* ==========================================================================
   SCREEN 1 —— 生演（点击驱动的抽卡生长）
   金字塔倒置：太极在下、八卦在上。
   ========================================================================== */
#gen-svg{width:min(100%,1040px);max-height:84vh}
.gen-link{stroke:var(--t4);stroke-width:1.2;fill:none;stroke-dasharray:1;stroke-dashoffset:1}
.gen-glyph{color:#c8c8d4}
.gen-node{transform-box:fill-box;transform-origin:50% 50%}
.gen-line{transform-box:fill-box;transform-origin:50% 50%}
.gen-seed{transform-box:fill-box;transform-origin:50% 50%;pointer-events:none}
.gen-ghost{fill:none;stroke:var(--t4);stroke-width:1.5;stroke-dasharray:5 6;opacity:0;pointer-events:none}
.gen-hit{fill:transparent;stroke:none}
.gen-node[data-clickable="1"]{cursor:pointer}
.gen-node[data-clickable="1"]:hover{filter:drop-shadow(0 0 12px rgba(255,255,255,.5))}
.gen-node:focus{outline:none}
.gen-node:focus-visible .gen-hit{stroke:var(--t7);stroke-width:1.5;stroke-dasharray:4 3}
.gen-label{fill:var(--t7);font-family:var(--font-cn);font-size:18px;text-anchor:middle}
.gen-label.dim{fill:var(--t5);font-size:15px;text-anchor:start}

/* ==========================================================================
   SCREEN 2 —— 重卦 · 六十四卦矩阵
   ========================================================================== */
#gen-matrix{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
#matrix-svg{width:min(100%,1120px);max-height:80vh}

/* ==========================================================================
   SCREEN 3 —— 起卦
   ========================================================================== */
.cast-wrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.cast-head{font-size:12.5px;letter-spacing:.34em;color:var(--t6);display:flex;gap:20px;align-items:baseline}
.cast-head b{color:var(--t9);font-family:var(--font-cn);font-size:22px;letter-spacing:.08em;font-weight:400}
.cast-stack{display:flex;flex-direction:column-reverse;gap:15px;width:200px}
.slot{display:flex;align-items:center;gap:20px}
.slot .yao{flex:none;width:200px;height:16px}
.slot .val{
  font-family:var(--font-cn);font-size:13px;color:var(--t6);
  white-space:nowrap;min-width:118px;letter-spacing:.1em;
}
.slot .val.live{color:var(--t9)}

/* ==========================================================================
   SCREEN 4 —— 成卦
   ========================================================================== */
.settle-wrap{display:flex;flex-direction:column;align-items:center;gap:30px}
.pair{display:flex;align-items:flex-start;gap:44px}
.pair .col{display:flex;flex-direction:column;align-items:center;gap:14px}
.pair .cap{font-size:11px;letter-spacing:.3em;color:var(--t6)}
.arrow{font-size:19px;color:var(--t5);align-self:center;margin-top:60px}
.hex-box{position:relative;padding:20px 30px;border:1px solid var(--t2);border-radius:3px}
.sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:3px}
.sheen i{
  position:absolute;top:-40%;left:-60%;width:36%;height:180%;display:block;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.17),transparent);
  transform:skewX(-18deg);
}
.hex-name{
  font-family:var(--font-cn);font-size:24px;letter-spacing:.26em;color:var(--t9);
  white-space:nowrap;opacity:0;
}
.hex-sub{font-size:12px;letter-spacing:.34em;color:var(--t6);opacity:0;text-align:center}

/* ==========================================================================
   SCREEN 5 —— 错综演算
   硬约束：本卦框与展示位框必须同行、等几何、固定 gap。
   由此 dx/dy、交卦错身量、互卦的源爻↔目标爻映射全是常数，无需逐帧测量。
   ========================================================================== */
#network{flex-direction:column;gap:18px}
.net-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.net-title{font-family:var(--font-cn);font-size:15px;letter-spacing:.3em;color:var(--t7)}
.net-btn{
  font-family:var(--font-ui);font-size:12px;letter-spacing:.2em;
  color:var(--t8);background:transparent;border:1px solid var(--t4);
  padding:7px 15px;border-radius:2px;cursor:pointer;
  transition:border-color .25s,color .25s,background .25s;
}
.net-btn:hover{color:var(--w);border-color:var(--t7);background:rgba(255,255,255,.045)}

.net-board{display:flex;gap:24px;align-items:flex-start;justify-content:center;width:100%}
.board-col{display:flex;flex-direction:column;gap:14px;flex:0 0 auto}
.board-mid{display:flex;flex-direction:column;gap:20px;align-items:center}
.board-top{display:flex;gap:14px;justify-content:center}
.board-pair{display:flex;gap:36px;position:relative;align-items:flex-start}

.frame{
  position:relative;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:18px 26px;border:1px solid var(--t2);border-radius:3px;
  min-width:212px;   /* 两框等宽是硬约束的一部分 */
}
.f-stack{
  position:relative;
  --yw:158px; --yh:14px; --ygap:12px;
}
.f-cap{font-size:10.5px;letter-spacing:.34em;color:var(--t6)}
.frame .hex-name{font-size:22px}

/* 在飞的复制体：覆盖在本卦框上，z 高于两框 */
.stack.guest{position:absolute;pointer-events:none;z-index:5;margin:0}

/* 卡片 */
.card{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 10px;min-width:104px;
  background:rgba(10,10,14,.74);border:1px solid var(--t2);border-radius:3px;
  font-family:var(--font-ui);color:inherit;cursor:pointer;
  transition:border-color .22s,background .22s,transform .22s var(--ease-settle);
}
.card:hover,.card:focus-visible{
  border-color:var(--t7);background:rgba(24,24,30,.95);outline:none;
  transform:translateY(-2px);z-index:6;
}
.card[data-active="1"]{border-color:var(--w);background:rgba(32,32,40,.96)}
.card .mini{display:flex;flex-direction:column-reverse;gap:3.5px;width:68px}
.card .mini .yao{height:4.5px;width:68px}
.card .mini .seg{background:var(--t7);border-radius:.5px}
.card .c-label{font-size:10px;letter-spacing:.18em;color:var(--t6)}
.card .c-name{font-family:var(--font-cn);font-size:13.5px;letter-spacing:.1em;color:var(--t8)}
.card .c-badge{
  visibility:hidden;font-size:9.5px;letter-spacing:.12em;color:var(--t6);
  border:1px solid var(--t4);border-radius:2px;padding:1px 5px;
}
.card[data-dup="1"] .c-badge{visibility:visible}

/* 互卦抽取括号（沿用 1.0） */
.bracket{
  position:absolute;width:9px;opacity:0;top:0;height:0;
  border:1px solid rgba(255,255,255,.6);transition:opacity .22s;
}
.bracket.l{left:-17px;border-right:none}
.bracket.r{right:-17px;border-left:none}
.bracket.on{opacity:.92}

/* ==========================================================================
   HUD
   ========================================================================== */
#skip{
  position:fixed;right:24px;bottom:24px;z-index:9;
  font-family:var(--font-ui);font-size:11.5px;letter-spacing:.28em;
  color:var(--t6);background:transparent;border:1px solid var(--t3);
  padding:8px 16px;border-radius:2px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s,color .25s,border-color .25s;
}
#skip.on{opacity:1;pointer-events:auto}
#skip:hover{color:var(--w);border-color:var(--t7)}

@media (prefers-reduced-motion: reduce){
  .taiji{animation:none}
  .stack[data-phase="settled"] .yao[data-moving="1"] .glow{animation:none;opacity:.6}
}

@media (max-width: 980px){
  /* 竖排后内容会高于视口，本屏需要能滚 */
  #network{justify-content:flex-start;overflow-y:auto}
  .net-board{flex-direction:column;align-items:center}
  .board-col{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .board-pair{gap:20px}
  .frame{min-width:0;padding:12px 16px}
  .f-stack{--yw:110px;--yh:11px;--ygap:9px}
}
</style>
</head>
<body>

<main id="stage">

  <!-- 屏 0 · 静 -->
  <section class="screen" data-screen="rest" id="rest">
    <div class="halo" aria-hidden="true"></div>
    <div class="taiji" role="button" tabindex="0" aria-label="点击起卦">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <defs><clipPath id="taijiClip"><circle cx="0" cy="0" r="100"/></clipPath></defs>
        <g clip-path="url(#taijiClip)">
          <circle cx="0" cy="0" r="100" fill="#0b0b0f"/>
          <path d="M0,-100 A100,100 0 0 1 0,100 Z" fill="#f2f2f7"/>
          <circle cx="0" cy="-50" r="50" fill="#0b0b0f"/>
          <circle cx="0" cy="50" r="50" fill="#f2f2f7"/>
          <circle cx="0" cy="-50" r="13" fill="#f2f2f7"/>
          <circle cx="0" cy="50" r="13" fill="#0b0b0f"/>
        </g>
        <circle cx="0" cy="0" r="99" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.4"/>
      </svg>
    </div>
    <p class="hint">点击太极 · <b>起卦</b></p>
  </section>

  <!-- 屏 1 · 生演（点击抽卡） -->
  <section class="screen" data-screen="generate" id="generate">
    <svg id="gen-svg" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"
         role="group" aria-label="太极生演：点击生出两仪、四象、八卦"></svg>
    <p class="hint" id="gen-hint">点击太极 · <b>生两仪</b></p>
  </section>

  <!-- 屏 2 · 重卦（六十四卦矩阵） -->
  <section class="screen" data-screen="matrix" id="matrix">
    <div id="gen-matrix">
      <svg id="matrix-svg" viewBox="0 0 1120 940" preserveAspectRatio="xMidYMid meet"
           role="img" aria-label="六十四卦方阵"></svg>
      <button class="net-btn" id="to-cast">继续 · 起卦</button>
    </div>
  </section>

  <!-- 屏 3 · 起卦 -->
  <section class="screen" data-screen="cast">
    <div class="cast-wrap">
      <div class="cast-head">摇卦 <b><span id="cast-n">0</span> / 6</b></div>
      <div class="cast-stack" id="cast-stack"></div>
    </div>
    <p class="hint">六爻 · <b>自下而上</b></p>
  </section>

  <!-- 屏 4 · 成卦 -->
  <section class="screen" data-screen="settle">
    <div class="settle-wrap">
      <div class="pair" id="settle-pair"></div>
      <div class="hex-sub" id="settle-sub"></div>
      <button class="net-btn" id="to-network">展开错综 · 十五卦</button>
    </div>
  </section>

  <!-- 屏 5 · 错综演算 -->
  <section class="screen" data-screen="network" id="network">
    <div class="net-toolbar">
      <span class="net-title">错综 · 十五卦</span>
      <button class="net-btn" id="restart">重新起卦</button>
    </div>
    <div class="net-board">
      <div class="board-col" id="board-left"></div>
      <div class="board-mid">
        <div class="board-top" id="board-top"></div>
        <div class="board-pair" id="board-pair">
          <div class="frame">
            <div class="stack f-stack" id="ben-stack"></div>
            <div class="hex-name" id="ben-name"></div>
            <div class="f-cap">本卦</div>
            <div class="bracket l" id="br-l"></div>
            <div class="bracket r" id="br-r"></div>
          </div>
          <div class="frame">
            <div class="stack f-stack" id="show-stack"></div>
            <div class="hex-name" id="show-name"></div>
            <div class="f-cap" id="show-cap">之卦</div>
          </div>
        </div>
      </div>
      <div class="board-col" id="board-right"></div>
    </div>
  </section>

</main>

<button id="skip">跳过</button>

<script>
/* ==========================================================================
   DATA —— 纯查表与常量
   ========================================================================== */
const DATA = (() => {
  // 三爻卦：值 = b0 + b1*2 + b2*4（b0 为初爻 / 最下）
  const TRIGRAM = [
    {v:0, name:'坤', sym:'☷', bits:[0,0,0]},
    {v:1, name:'震', sym:'☳', bits:[1,0,0]},
    {v:2, name:'坎', sym:'☵', bits:[0,1,0]},
    {v:3, name:'兑', sym:'☱', bits:[1,1,0]},
    {v:4, name:'艮', sym:'☶', bits:[0,0,1]},
    {v:5, name:'离', sym:'☲', bits:[1,0,1]},
    {v:6, name:'巽', sym:'☴', bits:[0,1,1]},
    {v:7, name:'乾', sym:'☰', bits:[1,1,1]},
  ];

  // 64 卦全名：下标 = 下卦(内)值 + 上卦(外)值 * 8；行 = 上卦，列 = 下卦
  const HEX = [
  //   下坤     下震     下坎     下兑     下艮     下离     下巽     下乾
    '坤为地','地雷复','地水师','地泽临','地山谦','地火明夷','地风升','地天泰', // 上坤
    '雷地豫','震为雷','雷水解','雷泽归妹','雷山小过','雷火丰','雷风恒','雷天大壮', // 上震
    '水地比','水雷屯','坎为水','水泽节','水山蹇','水火既济','水风井','水天需', // 上坎
    '泽地萃','泽雷随','泽水困','兑为泽','泽山咸','泽火革','泽风大过','泽天夬', // 上兑
    '山地剥','山雷颐','山水蒙','山泽损','艮为山','山火贲','山风蛊','山天大畜', // 上艮
    '火地晋','火雷噬嗑','火水未济','火泽睽','火山旅','离为火','火风鼎','火天大有', // 上离
    '风地观','风雷益','风水涣','风泽中孚','风山渐','风火家人','巽为风','风天小畜', // 上巽
    '天地否','天雷无妄','天水讼','天泽履','天山遯','天火同人','天风姤','乾为天', // 上乾
  ];

  const SIXIANG = ['太阳','少阴','少阳','太阴'];
  const LINE_CN = ['初','二','三','四','五','上'];

  // 大衍筮法：老阴 6 / 少阳 7 / 少阴 8 / 老阳 9
  const LINE_PROB = {6:1/16, 7:5/16, 8:7/16, 9:3/16};
  const VAL_NAME  = {6:'老阴', 7:'少阳', 8:'少阴', 9:'老阳'};

  // 互卦五种变法
  const HU_MODES = [
    {key:'chu',     label:'去初',   removed:[0],   lower:[1,2,3], upper:[3,4,5]},
    {key:'shang',   label:'去上',   removed:[5],   lower:[0,1,2], upper:[2,3,4]},
    {key:'chushang',label:'去初上', removed:[0,5], lower:[1,2,3], upper:[2,3,4]},
    {key:'chuer',   label:'去初二', removed:[0,1], lower:[2,3,4], upper:[3,4,5]},
    {key:'wushang', label:'去五上', removed:[4,5], lower:[0,1,2], upper:[1,2,3]},
  ];

  // 生演树几何（公式预算，不测量）
  //   层 y：太极在底、八卦在顶 → y(d) = Y0 - d*RH
  //   层内 x：x(col,d) = (col+.5)/2^d * W
  //   宽度校验：8*GW + 7*(W/8 - GW) = 8*84 + 7*41 = 959 <= 1000（留 20px 余量）
  const GROW = { W:1000, Y0:620, RH:180, TAIJI_R:34, GW:84, GT:6, GGAP:11 };

  // 64 矩阵几何：行 = 上卦、列 = 下卦，行列都是先天生成序
  const MATRIX = { X0:90, Y0:80, CW:125, CH:100, GW:84, GT:6, GGAP:11 };

  const DUR = {
    charge:520, drop:250, settle:220, flip:340, rotate:620,     // 起卦 / 通用
    genCharge:720, genDraw:560, genSettle:520,                  // 生演抽爻三段
    travel:620, clearShow:260, reveal:480, fission:600,         // 错综演算
  };
  const EASE = {
    charge:'cubic-bezier(.5,0,.8,.2)',
    drop:'cubic-bezier(.2,.9,.25,1.15)',
    settle:'cubic-bezier(.4,0,.2,1)',
  };

  return {TRIGRAM, HEX, SIXIANG, LINE_CN, LINE_PROB, VAL_NAME, HU_MODES,
          GROW, MATRIX, DUR, EASE};
})();

/* ==========================================================================
   RULES —— 纯函数，无 DOM、无副作用
   ========================================================================== */
const RULES = (() => {
  const triVal     = (b0,b1,b2) => b0 + b1*2 + b2*4;
  const lowerVal   = b => triVal(b[0],b[1],b[2]);
  const upperVal   = b => triVal(b[3],b[4],b[5]);
  const bitsToValue= b => lowerVal(b) + upperVal(b)*8;
  const bitsToName = b => DATA.HEX[bitsToValue(b)];
  const lowerTri   = b => DATA.TRIGRAM[lowerVal(b)];
  const upperTri   = b => DATA.TRIGRAM[upperVal(b)];

  // ★ 三爻卦名由 bits 反查，不按位置。
  //   生演树是随机生长的，位置与卦不再对应，按位置贴名必错。
  const bitsToTrigram  = b3 => DATA.TRIGRAM[triVal(b3[0],b3[1],b3[2])];
  const bitsToSixiang  = b2 => DATA.SIXIANG[(b2[0] ? 0 : 2) + (b2[1] ? 0 : 1)];

  // 生演抽爻：1/2 均匀（与六爻起卦的大衍筮法是两套独立随机）
  const coin = () => Math.random() < .5 ? 1 : 0;

  // 生演树坐标（公式预算）
  const growX  = (col,d) => (col + .5) / (1 << d) * DATA.GROW.W;
  const growY  = d => DATA.GROW.Y0 - d * DATA.GROW.RH;
  const glyphH = d => d * DATA.GROW.GT + Math.max(0, d - 1) * DATA.GROW.GGAP;

  const isMovingVal   = v => v === 6 || v === 9;
  const bitsOfValues  = vs => vs.map(v => (v === 7 || v === 9) ? 1 : 0);
  const movingOfValues= vs => vs.map(isMovingVal);

  const flipLine     = (b,i) => b.map((x,j) => j === i ? (x ? 0 : 1) : x);
  const invertAll    = b => b.map(x => x ? 0 : 1);
  const reverseBits  = b => b.slice().reverse();
  const swapTrigrams = b => [b[3],b[4],b[5],b[0],b[1],b[2]];
  const diffLines    = (a,b) => a.map((x,i) => x !== b[i] ? i : -1).filter(i => i >= 0);

  const huBuild = (b,m) => [...m.lower.map(i => b[i]), ...m.upper.map(i => b[i])];

  // 大衍筮法抽一爻：返回 6 / 7 / 8 / 9（老阴:少阳:少阴:老阳 = 1:5:7:3）
  function drawValue(){
    const p = DATA.LINE_PROB;
    let r = Math.random(), acc = 0;
    for(const v of [6,7,8,9]){ acc += p[v]; if(r < acc) return v; }
    return 9;
  }

  // 本卦 + 14 变体 = 15 格系统
  function buildVariants(bits){
    const out = [];
    const push = o => {
      o.bits = o.bits.slice();
      o.name = bitsToName(o.bits);
      out.push(o);
    };

    push({slot:'ben', kind:'ben', label:'本卦', bits, changedLines:[], hlMode:'none'});

    for(let i = 0; i < 6; i++){
      push({slot:'bian'+i, kind:'bian', line:i, label:'变 · ' + DATA.LINE_CN[i] + '爻',
            bits: flipLine(bits,i), changedLines:[i], hlMode:'lines'});
    }
    push({slot:'zong', kind:'zong', label:'综卦 · 倒转', bits: reverseBits(bits),
          changedLines: diffLines(bits, reverseBits(bits)), hlMode:'rotate'});
    push({slot:'cuo',  kind:'cuo',  label:'错卦 · 全反', bits: invertAll(bits),
          changedLines: diffLines(bits, invertAll(bits)), hlMode:'all'});
    push({slot:'jiao', kind:'jiao', label:'交卦 · 上下互换', bits: swapTrigrams(bits),
          changedLines: diffLines(bits, swapTrigrams(bits)), hlMode:'trigramSwap'});

    DATA.HU_MODES.forEach(m => {
      const hb = huBuild(bits, m);
      push({slot:'hu-' + m.key, kind:'hu', label:'互 · ' + m.label, bits: hb,
            changedLines: diffLines(bits, hb), hlMode:'removeKept',
            hu:{lower:m.lower, upper:m.upper, removed:m.removed}});
    });

    return out;
  }

  // 之卦：动爻全变
  const zhiBits = (b,mv) => b.map((x,i) => mv[i] ? (x ? 0 : 1) : x);

  // 先天生成序：乾 兑 离 震 巽 坎 艮 坤（64 矩阵的行列序）
  const generationOrder = () => [7,3,5,1,6,2,4,0].map(i => DATA.TRIGRAM[i]);

  return {triVal, lowerVal, upperVal, bitsToValue, bitsToName, lowerTri, upperTri,
          bitsToTrigram, bitsToSixiang, coin, growX, growY, glyphH,
          isMovingVal, bitsOfValues, movingOfValues, flipLine, invertAll, reverseBits,
          swapTrigrams, diffLines, huBuild, drawValue, buildVariants, zhiBits,
          generationOrder};
})();

/* ==========================================================================
   STORE —— 单一状态 + 订阅
   ========================================================================== */
const STORE = (() => {
  const state = {values:[], bits:[], moves:[], variants:[]};
  const subs = [];
  const api = {
    state,
    set(patch){ Object.assign(state, patch); subs.forEach(f => f(state)); },
    subscribe(f){ subs.push(f); },
    reset(){ api.set({values:[], bits:[], moves:[], variants:[]}); },
  };
  return api;
})();

/* ==========================================================================
   UTIL
   ========================================================================== */
const UTIL = (() => {
  const qs = (s, r = document) => r.querySelector(s);
  const qsa = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const debounce = (fn, ms) => { let t; return function(){ const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; };
  const raf = fn => requestAnimationFrame(() => requestAnimationFrame(fn));
  return {qs, qsa, clamp, debounce, raf};
})();

/* ==========================================================================
   ANIM —— WAAPI 封装 + 全局注册表 + epoch 取消
   ========================================================================== */
const ANIM = (() => {
  const anims = new Set();
  let epoch = 0;
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  let mul = mq.matches ? 0.15 : 1;
  if(mq.addEventListener) mq.addEventListener('change', e => { mul = e.matches ? 0.15 : 1; });

  const d = ms => Math.max(16, Math.round(ms * mul));

  function reg(a){
    anims.add(a);
    a.finished.catch(() => {}).then(() => anims.delete(a));
    return a;
  }
  // 切屏解药：取消一切在飞动画。★ 错综页连点绝不可用它（见 STAGE）。
  function cancelAll(){
    epoch++;
    anims.forEach(a => { try { a.cancel(); } catch(e){} });
    anims.clear();
  }
  const cur = () => epoch;
  const alive = e => e === epoch;

  function play(el, kf, opt){
    opt = opt || {};
    return reg(el.animate(kf, {
      duration: d(opt.duration != null ? opt.duration : 300),
      delay: d(opt.delay || 0),
      easing: opt.easing || DATA.EASE.settle,
      fill: opt.fill || 'both',
    }));
  }
  const await_ = a => a.finished.catch(() => {});
  const sleep = ms => new Promise(r => setTimeout(r, d(ms)));

  return {reg, cancelAll, cur, alive, play, await_, sleep, d, reduced: () => mq.matches};
})();

/* ==========================================================================
   RENDER —— 数据 → DOM / SVG
   ========================================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';

const RENDER = (() => {
  const {qs, qsa} = UTIL;

  /* ---------- DOM：爻栈 ---------- */

  function yaoEl(bit, opts){
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'yao';
    el.dataset.yang = bit ? '1' : '0';
    if(opts.moving) el.dataset.moving = '1';
    if(opts.ghost)  el.dataset.ghost  = '1';

    const glow = document.createElement('i'); glow.className = 'glow';
    const l = document.createElement('i'); l.className = 'seg seg-l';
    const r = document.createElement('i'); r.className = 'seg seg-r';
    el.append(glow, l, r);

    if(opts.mark){
      const m = document.createElement('b'); m.className = 'mark'; m.textContent = opts.mark;
      el.append(m);
    }
    return el;
  }

  // 爻栈：index 0（初爻）在最下
  function stackEl(bits, opts){
    opts = opts || {};
    const s = document.createElement('div');
    s.className = 'yao-stack stack';
    fillStack(s, bits, opts);
    return s;
  }

  function fillStack(s, bits, opts){
    opts = opts || {};
    s.innerHTML = '';
    bits.forEach((b,i) => s.append(yaoEl(b, {
      moving: opts.moves ? opts.moves[i] : false,
      // 动爻标记：只标「动」，不再用 ○/× 区分阴阳
      mark:   (opts.moves && opts.moves[i]) ? '动' : '',
    })));
    return s;
  }

  function miniEl(bits){
    const s = document.createElement('div');
    s.className = 'mini';
    bits.forEach(b => s.append(yaoEl(b)));
    return s;
  }

  // 逐爻翻转（阴阳互换）：只 morph 两段的 scaleX，转完提交数据并撤掉动画
  async function flipYao(yao, duration, delay){
    const y1 = yao.dataset.yang === '1';
    const from = y1 ? 1 : .88, to = y1 ? .88 : 1;
    const segs = qsa('.seg', yao);
    const anims = segs.map(s => ANIM.play(s,
      [{transform:'scaleX(' + from + ')'}, {transform:'scaleX(' + to + ')'}],
      {duration: duration || DATA.DUR.flip, delay: delay || 0, fill:'forwards'}));
    await Promise.all(anims.map(a => ANIM.await_(a)));
    yao.dataset.yang = to === 1 ? '1' : '0';
    anims.forEach(a => a.cancel());
  }

  // 一次性落定多组高亮：map = { 爻序号: 类名 }
  function hotMap(hexEl, map){
    qsa('.yao', hexEl).forEach((y,i) => {
      const cls = map[i];
      if(cls) y.dataset.hot = cls; else delete y.dataset.hot;
    });
  }
  function setHot(hexEl, indices, cls){
    qsa('.yao', hexEl).forEach((y,i) => {
      delete y.dataset.hot;
      if(indices.indexOf(i) >= 0) y.dataset.hot = cls;
    });
  }
  function clearHot(hexEl){ qsa('.yao', hexEl).forEach(y => { delete y.dataset.hot; }); }

  // 互卦抽取括号（列在下方的初爻 index 0）
  function setBracket(el, range, on){
    if(!on || !range.length){ el.classList.remove('on'); return; }
    const a = Math.min.apply(null, range), b = Math.max.apply(null, range);
    el.style.top    = ((5 - b) / 6 * 100) + '%';
    el.style.height = ((b - a + 1) / 6 * 100) + '%';
    el.classList.add('on');
  }

  /* ---------- SVG：生演树与 64 矩阵共用 ---------- */

  function svg(tag, attrs){
    const e = document.createElementNS(SVGNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function svgText(attrs, text){
    const t = svg('text', attrs); t.textContent = text; return t;
  }

  // 竖排爻线：bits index 0（初爻）在最下。
  // 每爻包一层 <g class="gen-line">，才能对单爻做 scaleX 抽出 / 翻转。
  function svgGlyph(bits, cx, cy, geo){
    const w = geo.w, th = geo.th, gap = geo.gap;
    const n = bits.length;
    const h = n * th + (n - 1) * gap;
    const g = svg('g', {class:'gen-glyph'});
    bits.forEach((b,i) => {
      const y = cy - h/2 + (n - 1 - i) * (th + gap);
      const line = svg('g', {class:'gen-line'});
      if(b){
        line.append(svg('rect', {x:cx - w/2, y, width:w, height:th, rx:1, fill:'currentColor'}));
      }else{
        const seg = w * .44;
        line.append(svg('rect', {x:cx - w/2,       y, width:seg, height:th, rx:1, fill:'currentColor'}));
        line.append(svg('rect', {x:cx + w/2 - seg, y, width:seg, height:th, rx:1, fill:'currentColor'}));
      }
      g.append(line);
    });
    return g;
  }

  return {yaoEl, stackEl, fillStack, miniEl, flipYao, hotMap, setHot, clearHot, setBracket,
          svg, svgText, svgGlyph};
})();

/* ==========================================================================
   GROW —— 屏 1 生演：点击驱动的抽卡生长
   --------------------------------------------------------------------------
   规则：每个父节点裂变第 2 个子节点时，新增的那一爻【强制为第 1 个的反】。
   由此保证「第 d 层恰好 2^d 个互不相同的节点」——
     子节点继承父的下方若干爻 ⇒ 父不同则子不同；
     同一父的两个子在新爻处一阴一阳 ⇒ 也不同。
   于是两仪恒 2 个、四象恒 4 个、八卦恒 8 个，正是「加一倍」。

   ★ 定位只用 node.col，绝不用 k 索引。
     父 col = n.col*2 + kidIndex ⇒ 「先抽出的在左边」。
   ========================================================================== */
const GROW = (() => {

  const geo = () => ({w:DATA.GROW.GW, th:DATA.GROW.GT, gap:DATA.GROW.GGAP});
  const halfH = n => n.d === 0 ? DATA.GROW.TAIJI_R : RULES.glyphH(n.d) / 2;

  let svg, linksL, ghostL, nodesL, labelsL, hintEl;
  let epochRef = 0, token = 0, idSeq = 0;
  let phase = 'ready', activeLayer = 0;
  let counts = [1,0,0,0];
  let nodes = [], byId = {};

  /* ---- 节点模型 ---- */

  function makeNode(d, col, bits, bit, parent){
    const n = {id: idSeq++, d, col, bits, bit, parent,
               kids: [], g: null, link: null, label: null, ghostEls: []};
    nodes.push(n); byId[n.id] = n;
    return n;
  }

  // 第 k 个子节点新增的那一爻：k=0 随机（1/2），k=1 取第 1 个的反
  function childBit(n, k){
    return k === 0 ? RULES.coin() : 1 - n.kids[0].bit;
  }
  function childSpec(n, k){
    const bit = childBit(n, k);
    return { d: n.d + 1, col: n.col * 2 + k, bits: n.bits.concat([bit]), bit };
  }

  const clickable = n => phase === 'ready' && n.d === activeLayer && n.kids.length < 2;

  /* ---- 绘制 ---- */

  function drawNode(n){
    const g = RENDER.svgGlyph(n.bits, RULES.growX(n.col, n.d), RULES.growY(n.d), geo());
    g.classList.add('gen-node');
    g.dataset.node = n.id;
    if(clickable(n)){
      g.dataset.clickable = '1';
      g.setAttribute('tabindex', '0');
      g.setAttribute('role', 'button');
      g.setAttribute('aria-label', '点击生' + ['','两仪','四象','八卦'][n.d + 1]);
    }
    // 点击热区（兼作 focus 环）
    const h = RULES.glyphH(n.d) + 26, w = DATA.GROW.GW + 26;
    g.append(RENDER.svg('rect', {
      class:'gen-hit',
      x: RULES.growX(n.col, n.d) - w/2,
      y: RULES.growY(n.d) - h/2,
      width: w, height: h, rx: 4,
    }));
    nodesL.append(g);
    n.g = g;
    return g;
  }

  function drawTaiji(){
    const cx = RULES.growX(0,0), cy = RULES.growY(0), r = DATA.GROW.TAIJI_R;
    const g = RENDER.svg('g', {class:'gen-node', 'data-node':0,
                               tabindex:'0', role:'button', 'aria-label':'点击生两仪'});
    g.dataset.clickable = '1';
    g.append(RENDER.svg('circle', {cx, cy, r, fill:'none', stroke:'#ececf3', 'stroke-width':2.4}));
    g.append(RENDER.svg('path', {
      d:'M' + cx + ',' + (cy-r) +
        ' A' + r + ',' + r + ' 0 0 1 ' + cx + ',' + (cy+r) +
        ' A' + (r/2) + ',' + (r/2) + ' 0 0 1 ' + cx + ',' + cy +
        ' A' + (r/2) + ',' + (r/2) + ' 0 0 0 ' + cx + ',' + (cy-r) + ' Z',
      fill:'#ececf3', opacity:.92,
    }));
    g.append(RENDER.svg('rect', {
      class:'gen-hit', x: cx-r-14, y: cy-r-14, width: (r+14)*2, height: (r+14)*2, rx:4,
    }));
    nodesL.append(g);
    return g;
  }

  // 定好位之后不再动，所以每次重建（跳过补全）都会先清空这一层
  // 八卦（d=3）是顶层，没有下一层，不画 ghost
  function drawGhosts(n){
    if(n.d >= 3 || n.ghostEls.length) return;
    const d = n.d + 1;
    const h = RULES.glyphH(d) + 18, w = DATA.GROW.GW + 18;
    for(let k = 0; k < 2; k++){
      const r = RENDER.svg('rect', {
        class:'gen-ghost',
        x: RULES.growX(n.col * 2 + k, d) - w/2,
        y: RULES.growY(d) - h/2,
        width: w, height: h, rx: 4,
      });
      ghostL.append(r);
      n.ghostEls.push(r);
    }
  }

  // 消费一个 ghost 槽：先取消它身上在飞的动画
  // （WAAPI 的 fill:'forwards' 会盖过内联样式，只写 style.opacity 是压不住的）
  function consumeGhost(el, on){
    if(!el) return;
    el.getAnimations().forEach(a => a.cancel());
    el.style.opacity = on ? '.16' : '0';
  }

  // ghost 槽 = 该节点还没填的子位置。只有「轮到它点」时才显示。
  function syncGhosts(n){
    const show = phase === 'ready' && n.d === activeLayer;
    n.ghostEls.forEach((el, k) => consumeGhost(el, show && k >= n.kids.length));
  }

  function drawLink(parent, child){
    const x1 = RULES.growX(parent.col, parent.d), y1 = RULES.growY(parent.d) - halfH(parent) - 6;
    const x2 = RULES.growX(child.col,  child.d),   y2 = RULES.growY(child.d)  + halfH(child)  + 6;
    const l = RENDER.svg('line', {
      class:'gen-link', pathLength:'1', x1, y1, x2, y2,
    });
    linksL.append(l);
    child.link = l;
    return l;
  }

  function labelFor(n){
    if(n.d === 2) return RULES.bitsToSixiang(n.bits);
    if(n.d === 3){ const t = RULES.bitsToTrigram(n.bits); return t.sym + ' ' + t.name; }
    return '';
  }
  function drawLabel(n){
    const txt = labelFor(n);
    if(!txt) return;
    const y = RULES.growY(n.d) + halfH(n) + 26;
    const t = RENDER.svgText({class:'gen-label', x: RULES.growX(n.col, n.d), y}, txt);
    t.style.opacity = 0;
    labelsL.append(t);
    n.label = t;
  }

  /* ---- 单次抽爻：蓄 → 抽/裂变 → 落/显 ---- */

  async function beat(parent, child, ghostEl, onUnlock){
    const my = token;
    const cg = RULES.growX(child.col, child.d), cyy = RULES.growY(child.d);

    /* 蓄 —— 此段结束前不解锁 */
    ANIM.play(parent.g, [
      {transform:'scale(1)'}, {transform:'scale(1.07)'}, {transform:'scale(1)'},
    ], {duration:DATA.DUR.genCharge, easing:DATA.EASE.charge, fill:'none'});

    const px = RULES.growX(parent.col, parent.d), py = RULES.growY(parent.d) - halfH(parent);
    const seed = RENDER.svg('g', {class:'gen-seed'});
    seed.append(RENDER.svg('circle', {cx:px, cy:py, r:8, fill:'#fff'}));
    seed.style.opacity = 0;
    nodesL.append(seed);
    ANIM.play(seed, [{transform:'scale(.2)', opacity:0}, {transform:'scale(1)', opacity:.95}],
      {duration:DATA.DUR.genCharge * .7, easing:DATA.EASE.charge, fill:'forwards'});
    if(ghostEl) ANIM.play(ghostEl, [{opacity:0},{opacity:.16}],
      {duration:DATA.DUR.genCharge * .8, fill:'forwards'});

    await ANIM.sleep(DATA.DUR.genCharge);
    if(my !== token || !ANIM.alive(epochRef)) { seed.remove(); return; }

    /* 抽 / 裂变 */
    drawLink(parent, child);
    const g = drawNode(child);
    drawGhosts(child);                        // 新节点自己也要有两个待填的子槽
    g.style.opacity = .55;
    const lines = UTIL.qsa('.gen-line', g);
    const newIdx = child.bits.length - 1;

    // 种子光点升到子节点位置
    ANIM.play(seed, [
      {transform:'translate(0px,0px) scale(1)'},
      {transform:'translate(' + (cg - px) + 'px,' + (cyy - py) + 'px) scale(1.9)'},
    ], {duration:DATA.DUR.genDraw, easing:DATA.EASE.drop, fill:'forwards'});

    if(child.link) ANIM.play(child.link, [{strokeDashoffset:1},{strokeDashoffset:0}],
      {duration:DATA.DUR.genDraw, fill:'forwards'});

    // 新爻：从中间向外抽出
    ANIM.play(lines[newIdx], [
      {transform:'scaleX(0)', opacity:0},
      {transform:'scaleX(1)', opacity:1},
    ], {duration: 380, delay: 110, easing: DATA.EASE.drop, fill:'none'});

    await ANIM.sleep(DATA.DUR.genDraw);
    if(my !== token || !ANIM.alive(epochRef)) { seed.remove(); return; }

    /* 抽完即解锁：把感知间隔压到约 1.1s，第 3 段作为尾巴与下次点击并行 */
    if(onUnlock) onUnlock();

    /* 落 / 显 */
    ANIM.play(g, [
      {opacity:.55, transform:'translateY(-10px) scale(.92)'},
      {opacity:1,   transform:'translateY(0px) scale(1)'},
    ], {duration:DATA.DUR.genSettle, easing:DATA.EASE.settle, fill:'none'});
    drawLabel(child);
    if(child.label) ANIM.play(child.label, [
      {opacity:0, transform:'translateY(6px)'}, {opacity:1, transform:'translateY(0px)'},
    ], {duration:DATA.DUR.genSettle, delay:120, fill:'none'});

    await ANIM.sleep(DATA.DUR.genSettle);
    seed.remove();
  }

  /* ---- 状态推进 ---- */

  async function click(id){
    const n = byId[id];
    if(!n || !clickable(n)) return;
    phase = 'animating';
    refreshClickable();

    const k = n.kids.length;
    const spec = childSpec(n, k);
    const child = makeNode(spec.d, spec.col, spec.bits, spec.bit, n.id);
    const ghostEl = n.ghostEls[k];
    n.kids.push(child);                       // 先登记，避免连点重复
    consumeGhost(ghostEl, false);

    let unlocked = false;
    const unlock = () => {                    // 抽完即放行，下一抽可立刻开始
      if(unlocked) return;
      unlocked = true;
      counts[child.d]++;
      if(activeLayer < 3 && counts[activeLayer + 1] === (1 << (activeLayer + 1))) activeLayer++;
      phase = 'ready';
      refreshClickable();
      updateHint();
    };

    const my = token;
    await beat(n, child, ghostEl, unlock);
    if(my !== token || !ANIM.alive(epochRef)) return;
    unlock();                                 // 兜底（被中途打断时）

    if(!finished && counts[3] === 8){ await finish(); }
  }

  function refreshClickable(){
    nodes.forEach(n => {
      if(!n.g) return;
      if(clickable(n)){
        n.g.dataset.clickable = '1';
        n.g.setAttribute('tabindex', '0');
      }else{
        delete n.g.dataset.clickable;
        n.g.removeAttribute('tabindex');
      }
      syncGhosts(n);
    });
  }

  function updateHint(){
    if(!hintEl) return;
    const t = ['','两仪','四象','八卦'][activeLayer + 1];
    const who = ['太极','任一仪','任一象'][activeLayer];
    hintEl.innerHTML = '点击' + who + ' · <b>生' + t + '</b>';
  }

  /* ---- 跳过：一步补全到终态 ---- */

  async function instant(){
    if(phase === 'done'){ FSM.goto('matrix'); return; }
    token++;                                  // 让在飞的 beat 静默退出
    phase = 'done';

    for(let d = activeLayer; d <= 2; d++){
      nodes.filter(n => n.d === d).forEach(p => {
        while(p.kids.length < 2){
          const k = p.kids.length;
          const spec = childSpec(p, k);
          const child = makeNode(spec.d, spec.col, spec.bits, spec.bit, p.id);
          p.kids.push(child);
          drawLink(p, child);
          child.link.style.opacity = 1;
          const g = drawNode(child);
          drawGhosts(child);
          drawLabel(child);
          if(child.label) child.label.style.opacity = 1;
          ANIM.play(g, [{opacity:0},{opacity:1}], {duration:300, fill:'none'});
        }
      });
    }
    nodes.forEach(syncGhosts);
    counts = [1, nodes.filter(n=>n.d===1).length,
                 nodes.filter(n=>n.d===2).length,
                 nodes.filter(n=>n.d===3).length];
    refreshClickable();
    await ANIM.sleep(320);
    if(!ANIM.alive(epochRef)) return;
    await finish();
  }

  /* ---- 收束：只留八卦行，然后进矩阵页 ---- */

  let finished = false;
  async function finish(){
    if(finished) return;
    finished = true;
    const my = token;
    nodes.forEach(n => {
      if(n.d < 3){
        ANIM.play(n.g, [{opacity:1},{opacity:0}], {duration:420, fill:'forwards'});
        if(n.label) ANIM.play(n.label, [{opacity:1},{opacity:0}], {duration:420, fill:'forwards'});
      }
      if(n.link) ANIM.play(n.link, [{opacity:1},{opacity:0}], {duration:420, fill:'forwards'});
      syncGhosts(n);
    });
    const top = nodes.filter(n => n.d === 3);
    top.forEach((n,i) => ANIM.play(n.g, [
      {transform:'scale(1)'}, {transform:'scale(1.05)'}, {transform:'scale(1)'},
    ], {duration:560, delay:i*45, easing:DATA.EASE.settle, fill:'none'}));
    await ANIM.sleep(1000);
    if(my !== token || !ANIM.alive(epochRef)) return;
    FSM.goto('matrix');
  }

  /* ---- 入口 ---- */

  function start(epoch){
    epochRef = epoch; token = 0; idSeq = 0;
    phase = 'ready'; activeLayer = 0; counts = [1,0,0,0];
    nodes = []; byId = {}; finished = false;

    svg = UTIL.qs('#gen-svg');
    hintEl = UTIL.qs('#gen-hint');
    svg.innerHTML = '';

    linksL  = RENDER.svg('g', {class:'gen-layer-links'});  svg.append(linksL);
    ghostL  = RENDER.svg('g', {class:'gen-layer-ghosts'}); svg.append(ghostL);
    nodesL  = RENDER.svg('g', {class:'gen-layer-nodes'});  svg.append(nodesL);
    labelsL = RENDER.svg('g', {class:'gen-layer-labels'}); svg.append(labelsL);

    // 层标签
    ['八卦','四象','两仪','太极'].forEach((t,i) => {
      const d = 3 - i;
      layerLabel(t, RULES.growY(d));
    });

    const root = makeNode(0, 0, [], null, null);
    root.g = drawTaiji();
    drawGhosts(root);
    refreshClickable();
    updateHint();
  }

  // 左边缘的层名（视觉参照，不可点）
  function layerLabel(t, y){
    const el = RENDER.svgText({class:'gen-label dim', x:14, y: y + 6}, t);
    el.setAttribute('fill', 'var(--t5)');
    labelsL.append(el);
  }

  return {start, click, instant,
          get counts(){ return counts.slice(); },
          get activeLayer(){ return activeLayer; },
          get nodes(){ return nodes; },
          get phase(){ return phase; }};
})();

/* ==========================================================================
   STAGE —— 屏 5 错综演算：三栏对照 + 展示位
   --------------------------------------------------------------------------
   ★ 硬约束：本卦框与展示位框同行、等几何、固定 gap。
     由此 dx/dy、交卦错身量 ±3*STEP、互卦的「源爻↔目标爻」映射全是常数。
     一旦让两框几何不同，这三个公式全部失效。

   ★ 展示位一定是「复制」本卦，不是移动本卦：
     本卦必须原地可见且不变（用户还要继续点别的卡），移动会留空框、也没法连点。

   ★ 连点绝不可用 ANIM.cancelAll()（那是切屏解药，会杀掉卡片入场尾帧）。
     只用局部 SHOW.seq + cancelGuest()。
   ========================================================================== */
const STAGE = (() => {

  const S = {
    seq: 0,
    state: 'idle',            // idle | leaving | traveling | mutating | shown
    bits: null, name: '', cap: '',
    guest: null, guestAnims: [],
  };

  let ben = [], moves = [], variants = [];
  let benStack, showStack, benName, showName, showCap, pair, brL, brR;
  let DX = 0, DY = 0, STEP = 0;
  let lastClickAt = 0;

  /* ---- 度量：只在初始化与 resize 时各做一次（不是逐帧） ---- */

  function measure(){
    const b = benStack.getBoundingClientRect();
    const z = showStack.getBoundingClientRect();
    DX = z.left - b.left;
    DY = z.top  - b.top;
    const firstYao = benStack.querySelector('.yao');
    STEP = firstYao ? firstYao.offsetHeight + (parseFloat(getComputedStyle(benStack).rowGap) || 12) : 26;
  }

  /* ---- 原语 ---- */

  function resetBase(){
    RENDER.clearHot(benStack);
    brL.classList.remove('on'); brR.classList.remove('on');
    UTIL.qsa('.yao', benStack).forEach(y => { y.style.transform = ''; });
    UTIL.qsa('.card').forEach(c => { delete c.dataset.active; });
  }

  async function clearShow(my){
    if(S.state === 'idle') return;
    ANIM.play(showStack, [{opacity:1, transform:'scale(1)'}, {opacity:0, transform:'scale(.96)'}],
      {duration:DATA.DUR.clearShow, fill:'none'});
    ANIM.play(showName, [{opacity:1},{opacity:0}], {duration:DATA.DUR.clearShow, fill:'none'});
    await ANIM.sleep(DATA.DUR.clearShow);
    if(my !== S.seq) return;
    showStack.style.opacity = '';
    showName.textContent = '';
    S.bits = null; S.state = 'idle';
  }

  // 复制一份本卦爻栈，绝对定位盖在本卦框（#ben-stack）上
  function spawnGuest(bits){
    const g = RENDER.stackEl(bits, {moves});
    g.classList.add('f-stack', 'guest');
    g.dataset.phase = 'settled';
    const b = benStack.getBoundingClientRect();
    const f = benStack.closest('.frame').getBoundingClientRect();
    g.style.left = (b.left - f.left) + 'px';
    g.style.top  = (b.top  - f.top)  + 'px';
    g.style.width = b.width + 'px';
    benStack.closest('.frame').append(g);
    S.guest = g;
    S.guestAnims = [];
    return g;
  }

  function trackGuest(a){ if(a) S.guestAnims.push(a); return a; }

  function cancelGuest(){
    if(!S.guest) return;
    S.guestAnims.forEach(a => { try { a.cancel(); } catch(e){} });
    S.guest.remove();
    S.guest = null; S.guestAnims = [];
  }

  async function travel(guest, my, arcUp){
    const bow = arcUp ? 16 : -16;
    trackGuest(ANIM.play(guest, [
      {transform:'translate(0px,0px)'},
      {transform:'translate(' + (DX*.5) + 'px,' + (DY*.5 + bow) + 'px)'},
      {transform:'translate(' + DX + 'px,' + DY + 'px)'},
    ], {duration:DATA.DUR.travel, easing:DATA.EASE.drop, fill:'forwards'}));
    await ANIM.sleep(DATA.DUR.travel);
    return my === S.seq;
  }

  async function flipLines(guest, idx, my){
    const yao = UTIL.qsa('.yao', guest);
    for(let j = 0; j < idx.length; j++){
      if(my !== S.seq) return false;
      await RENDER.flipYao(yao[idx[j]], DATA.DUR.flip, 0);
    }
    return my === S.seq;
  }

  async function rotateGuest(guest, my){
    S.guestAnims.forEach(a => { try { a.cancel(); } catch(e){} });
    S.guestAnims = [];
    trackGuest(ANIM.play(guest, [
      {transform:'translate(' + DX + 'px,' + DY + 'px) rotate(0deg)'},
      {transform:'translate(' + DX + 'px,' + DY + 'px) rotate(180deg)'},
    ], {duration:DATA.DUR.rotate, easing:DATA.EASE.settle, fill:'forwards'}));
    await ANIM.sleep(DATA.DUR.rotate);
    return my === S.seq;
  }

  // 交卦：下卦去展示位的上卦位、上卦去展示位的下卦位
  // ★ column-reverse 下 yao[0..2] 是下卦（初二三）、yao[3..5] 是上卦 —— 极易取反
  async function swapTrigramTravel(guest, my){
    const yao = UTIL.qsa('.yao', guest);
    const up = -3 * STEP, dn = 3 * STEP;
    yao.slice(0,3).forEach((y,i) => {          // 下卦 → 上方
      y.style.zIndex = 1;
      ANIM.play(y, [
        {transform:'translate(0px,0px)'},
        {transform:'translate(' + (DX*.5) + 'px,' + (up*.5 - 12) + 'px)'},
        {transform:'translate(' + DX + 'px,' + up + 'px)'},
      ], {duration:DATA.DUR.travel, delay:i*24, easing:DATA.EASE.drop, fill:'forwards'});
    });
    yao.slice(3,6).forEach((y,i) => {          // 上卦 → 下方
      y.style.zIndex = 2;
      ANIM.play(y, [
        {transform:'translate(0px,0px)'},
        {transform:'translate(' + (DX*.5) + 'px,' + (dn*.5 + 12) + 'px)'},
        {transform:'translate(' + DX + 'px,' + dn + 'px)'},
      ], {duration:DATA.DUR.travel, delay:i*24, easing:DATA.EASE.drop, fill:'forwards'});
    });
    await ANIM.sleep(DATA.DUR.travel + 2*24);
    return my === S.seq;
  }

  // 互卦：本卦上框选 + 去爻变暗 / 留爻变亮
  function bracketKept(hu){
    RENDER.setHot(benStack, hu.removed, 'dim');
    RENDER.setHot(benStack, hu.lower.concat(hu.upper), 'kept');
    RENDER.setBracket(brL, hu.lower, true);
    RENDER.setBracket(brR, hu.upper, true);
  }

  // 互卦：展示位「从无到有」淡显被框选的爻（位于源槽），再裂变到目标槽
  //   ★ 目标第 j 爻的源下标 src = j<3 ? lower[j] : upper[j]
  //     lower/upper 各 3 项 ⇒ 目标恒 6 槽；源只有 4 或 5 个不同下标（会重叠）。
  //     重叠的源同时供两个目标 ⇒ 必裂成两条。对 5 种模式统一生效。
  async function mutualBurst(v, my){
    const hu = v.hu;
    const src = j => j < 3 ? hu.lower[j] : hu.upper[j];

    bracketKept(hu);
    ANIM.play(benStack, [{opacity:1},{opacity:.82},{opacity:1}],
      {duration:DATA.DUR.reveal, fill:'none'});
    await ANIM.sleep(520);
    if(my !== S.seq) return false;

    const yao = UTIL.qsa('.yao', showStack);
    yao.forEach((y,j) => {
      const s = src(j);
      y.dataset.yang = ben[s] ? '1' : '0';
      y.style.transform = 'translateY(' + ((j - s) * STEP) + 'px)';
      ANIM.play(y, [{opacity:0},{opacity:1}],
        {duration:DATA.DUR.reveal, delay:j*30, fill:'none'});
    });
    showStack.style.opacity = '1';
    await ANIM.sleep(DATA.DUR.reveal + 5*30);
    if(my !== S.seq) return false;

    yao.forEach((y,j) => {
      ANIM.play(y, [
        {transform:'translateY(' + ((j - src(j)) * STEP) + 'px)'},
        {transform:'translateY(0px)'},
      ], {duration:DATA.DUR.fission, delay:j*40, easing:DATA.EASE.drop, fill:'forwards'});
    });
    await ANIM.sleep(DATA.DUR.fission + 5*40);
    yao.forEach(y => { y.style.transform = ''; });
    return my === S.seq;
  }

  function commit(bits, name, cap){
    RENDER.fillStack(showStack, bits, {});
    showStack.style.opacity = '';
    showName.textContent = name;
    ANIM.play(showName, [{opacity:0},{opacity:1}], {duration:320, fill:'none'});
    showCap.textContent = cap;
    S.bits = bits.slice(); S.name = name; S.cap = cap; S.state = 'shown';
  }

  /* ---- 五种变法的编配 ---- */

  const RECIPES = {
    // 变卦：本卦平移到展示位 → 对应那一爻变动
    async bian(v, my){
      const g = spawnGuest(ben);
      if(!await travel(g, my, true)) return;
      if(!await flipLines(g, [v.line], my)) return;
    },
    // 错卦：本卦平移到展示位 → 六爻同时阴阳翻转
    async cuo(v, my){
      const g = spawnGuest(ben);
      if(!await travel(g, my, true)) return;
      const yao = UTIL.qsa('.yao', g);
      const anims = [];
      yao.forEach((y,i) => anims.push(RENDER.flipYao(y, DATA.DUR.flip, i*55)));
      await Promise.all(anims);
      await ANIM.sleep(120);
    },
    // 综卦：本卦平移到展示位 → 整卦旋转 180°
    async zong(v, my){
      const g = spawnGuest(ben);
      if(!await travel(g, my, true)) return;
      await rotateGuest(g, my);
    },
    // 交卦：下卦与上卦对调位置
    async jiao(v, my){
      const g = spawnGuest(ben);
      await swapTrigramTravel(g, my);
    },
    // 互卦：本卦框选 → 展示位淡显留爻 → 裂变成上下卦叠加
    async hu(v, my){
      RENDER.fillStack(showStack, [0,0,0,0,0,0], {});
      showStack.style.opacity = '0';
      if(!await mutualBurst(v, my)) return;
    },
    // 本卦自身（不变化）
    async ben(v, my){
      const g = spawnGuest(ben);
      if(!await travel(g, my, true)) return;
      await ANIM.sleep(140);
    },
  };

  async function select(v){
    // 120ms 输入去抖：暴击连点只保留最后一发
    const now = Date.now();
    if(now - lastClickAt < 120) return;
    lastClickAt = now;

    const my = ++S.seq;
    cancelGuest();                    // 只杀在飞的复制体
    resetBase();
    await clearShow(my);              // 5.6：旧卦先淡化消失
    if(my !== S.seq) return;

    S.state = 'traveling';
    UTIL.qsa('.card').forEach(c => { if(c.dataset.slot === v.slot) c.dataset.active = '1'; });

    const recipe = RECIPES[v.kind] || RECIPES.ben;
    await recipe(v, my);
    if(my !== S.seq) return;

    commit(v.bits, v.name, v.label);
    cancelGuest();                    // 撤掉复制体，露出已定稿的展示位
  }

  /* ---- 构建 ---- */

  function makeCard(v){
    const el = document.createElement('button');
    el.className = 'card';
    el.dataset.slot = v.slot;
    el.dataset.kind = v.kind;
    if(v.dup) el.dataset.dup = '1';
    const lab = document.createElement('span'); lab.className = 'c-label'; lab.textContent = v.label;
    const mini = RENDER.miniEl(v.bits);
    const nm = document.createElement('span'); nm.className = 'c-name'; nm.textContent = v.name;
    const bd = document.createElement('span'); bd.className = 'c-badge'; bd.textContent = v.dup || '';
    el.append(lab, mini, nm, bd);
    return el;
  }

  function init(epoch){
    const st = STORE.state;
    ben = st.bits.slice(); moves = st.moves.slice();
    variants = RULES.buildVariants(ben);
    STORE.set({variants});

    // 重合检测：回文卦（综=本卦）/ 八纯卦（交=本卦）
    const seen = new Map();
    seen.set(ben.join(''), '本卦');
    variants.forEach(v => {
      if(v.kind === 'ben'){ v.dup = ''; return; }
      const key = v.bits.join('');
      if(seen.has(key)){ v.dup = '同' + seen.get(key); return; }
      seen.set(key, v.label); v.dup = '';
    });

    const bySlot = {}; variants.forEach(v => { bySlot[v.slot] = v; });

    benStack  = UTIL.qs('#ben-stack');
    showStack = UTIL.qs('#show-stack');
    benName   = UTIL.qs('#ben-name');
    showName  = UTIL.qs('#show-name');
    showCap   = UTIL.qs('#show-cap');
    pair      = UTIL.qs('#board-pair');
    brL = UTIL.qs('#br-l'); brR = UTIL.qs('#br-r');

    // 本卦框
    RENDER.fillStack(benStack, ben, {moves});
    benStack.dataset.phase = 'settled';
    benName.textContent = RULES.bitsToName(ben);
    ANIM.play(benName, [{opacity:0},{opacity:1}], {duration:420, fill:'none'});

    // 展示位：先摆 6 个空槽（互卦演化要用），默认态由 defaultShow() 决定
    RENDER.fillStack(showStack, [0,0,0,0,0,0], {});

    // 左列 6 张变卦（上 → 下 = 上爻 → 初爻，与「垂直位置 = 变哪一爻」一致）
    const left = UTIL.qs('#board-left'); left.innerHTML = '';
    [5,4,3,2,1,0].forEach(i => left.append(makeCard(bySlot['bian' + i])));

    // 顶部 综 / 错 / 交
    const top = UTIL.qs('#board-top'); top.innerHTML = '';
    ['zong','cuo','jiao'].forEach(k => top.append(makeCard(bySlot[k])));

    // 右列 5 张互卦
    const right = UTIL.qs('#board-right'); right.innerHTML = '';
    DATA.HU_MODES.forEach(m => right.append(makeCard(bySlot['hu-' + m.key])));

    measure();

    // 默认态（5.0）：展示位 = 之卦（所有动爻一起变）；无动爻则留空
    const hasMove = moves.some(Boolean);
    if(hasMove){
      const zb = RULES.zhiBits(ben, moves);
      S.bits = zb.slice(); S.name = RULES.bitsToName(zb); S.cap = '之卦'; S.state = 'shown';
      RENDER.fillStack(showStack, zb, {});
      showName.textContent = S.name;
      showCap.textContent = '之卦';
      showStack.style.opacity = '0';
      showName.style.opacity = '0';
      ANIM.play(showStack, [{opacity:0},{opacity:1}], {duration:520, delay:200, fill:'none'});
      ANIM.play(showName, [{opacity:0},{opacity:1}], {duration:520, delay:260, fill:'none'});
    }else{
      S.bits = null; S.state = 'idle';
      showName.textContent = '';
      showCap.textContent = '无动爻';
    }

    // 卡片入场
    UTIL.qsa('.card').forEach((el,i) => {
      ANIM.play(el, [{opacity:0, transform:'translateY(8px)'},{opacity:1, transform:'translateY(0px)'}],
        {duration:380, delay:i*36, easing:DATA.EASE.settle, fill:'none'});
    });
  }

  return {init, select, measure, get SHOW(){ return S; }};
})();

/* ==========================================================================
   FSM —— 六屏路由 + 输入闸门 + 取消
   ========================================================================== */
const FSM = (() => {
  const SCREENS = ['rest','generate','matrix','cast','settle','network'];
  const PLAYS = {};
  let current = null;
  let busy = false;

  const screenEl = name => UTIL.qs('.screen[data-screen="' + name + '"]');

  function goto(name){
    ANIM.cancelAll();                 // 切屏解药：在飞的动画与 await 立即失效
    SCREENS.forEach(s => {
      const el = screenEl(s);
      if(el) el.classList.toggle('active', s === name);
    });
    const changed = current !== name;
    current = name;
    UTIL.qs('#skip').classList.toggle('on', name === 'generate');
    if(changed && PLAYS[name]) PLAYS[name]();
  }

  function withBusy(fn){
    if(busy) return Promise.resolve();
    busy = true;
    return Promise.resolve().then(fn).finally(() => { busy = false; });
  }

  async function skip(){
    if(current === 'generate') await GROW.instant();
    else if(current === 'cast') await PLAYS.cast.instant();
  }

  return {
    goto, skip, withBusy, screenEl, SCREENS, PLAYS,
    get current(){ return current; },
    get busy(){ return busy; },
  };
})();

/* ==========================================================================
   PLAYS —— 各屏的编排
   ========================================================================== */
const PLAYS = FSM.PLAYS;

/* --- 屏 1 · 生演（点击驱动） --------------------------------------------- */
PLAYS.generate = function(){
  GROW.start(ANIM.cur());
};

/* --- 屏 2 · 重卦（六十四卦矩阵） ----------------------------------------- */
PLAYS.matrix = function(){
  const svg = UTIL.qs('#matrix-svg');
  svg.innerHTML = '';
  const M = DATA.MATRIX;
  const order = RULES.generationOrder();          // 乾 兑 离 震 巽 坎 艮 坤
  const geo = {w:M.GW, th:M.GT, gap:M.GGAP};

  // 列首（下卦）
  order.forEach((t,c) => {
    svg.append(RENDER.svgText({
      class:'gen-label', x: M.X0 + c*M.CW + M.CW/2, y: M.Y0 - 22,
    }, t.sym + ' ' + t.name));
  });
  // 行首（上卦）
  order.forEach((t,r) => {
    const el = RENDER.svgText({
      class:'gen-label', x: M.X0 - 18, y: M.Y0 + r*M.CH + M.CH/2 + 7,
    }, t.sym + ' ' + t.name);
    el.setAttribute('text-anchor', 'end');
    svg.append(el);
  });

  // 8×8 = 64 卦：行 = 上卦、列 = 下卦
  for(let r = 0; r < 8; r++){
    for(let c = 0; c < 8; c++){
      const bits = order[c].bits.concat(order[r].bits);
      const cx = M.X0 + c*M.CW + M.CW/2;
      const cy = M.Y0 + r*M.CH + M.CH/2;
      const g = RENDER.svgGlyph(bits, cx, cy, geo);
      svg.append(g);
      ANIM.play(g, [{opacity:0},{opacity:.94}],
        {duration:280, delay:(r + c) * 26, fill:'none'});
    }
  }
  // 细网格
  for(let i = 0; i <= 8; i++){
    svg.insertBefore(RENDER.svg('line', {
      x1: M.X0, y1: M.Y0 + i*M.CH, x2: M.X0 + 8*M.CW, y2: M.Y0 + i*M.CH,
      stroke:'var(--t2)', 'stroke-width':.8,
    }), svg.firstChild);
  }
};

/* --- 屏 3 · 起卦 --------------------------------------------------------- */
PLAYS.cast = async function(){
  const epoch = ANIM.cur();
  const stack = UTIL.qs('#cast-stack');
  const counter = UTIL.qs('#cast-n');
  const values = [], bits = [], moves = [];

  stack.innerHTML = '';
  const slots = [];
  for(let i = 0; i < 6; i++){
    const slot = document.createElement('div'); slot.className = 'slot';
    const yao = RENDER.yaoEl(0, {ghost:true});
    const val = document.createElement('span'); val.className = 'val';
    val.textContent = DATA.LINE_CN[i] + '爻';
    slot.append(yao, val);
    stack.append(slot);
    slots.push({slot, yao, val});
  }
  counter.textContent = '0';

  for(let i = 0; i < 6; i++){
    const {slot, yao, val} = slots[i];
    const v = RULES.drawValue();
    const bit = (v === 7 || v === 9) ? 1 : 0;
    const moving = RULES.isMovingVal(v);

    // 蓄：抖动 + 占位由暗转亮
    const shake = ANIM.play(slot, [
      {transform:'translateX(0)'},    {transform:'translateX(-2.5px)'},
      {transform:'translateX(2.5px)'},{transform:'translateX(-1.5px)'},
      {transform:'translateX(1.5px)'},{transform:'translateX(0)'},
    ], {duration: DATA.DUR.charge, easing: DATA.EASE.charge, fill:'none'});
    ANIM.play(yao, [{opacity:.1}, {opacity:.4}],
      {duration: DATA.DUR.charge, easing: DATA.EASE.charge, fill:'none'});
    await ANIM.await_(shake);
    if(!ANIM.alive(epoch)) return;

    // 落：爻线归位
    delete yao.dataset.ghost;
    yao.dataset.yang = bit ? '1' : '0';
    if(moving) yao.dataset.moving = '1';
    const drop = ANIM.play(yao, [
      {opacity:0, transform:'translateY(-46px) scale(.68)'},
      {opacity:1, transform:'translateY(0) scale(1)'},
    ], {duration: DATA.DUR.drop, easing: DATA.EASE.drop});
    await ANIM.await_(drop);
    if(!ANIM.alive(epoch)) return;

    // 显：动爻持续呼吸
    if(moving){
      ANIM.play(yao.querySelector('.glow'), [{opacity:0},{opacity:.95},{opacity:.5}],
        {duration: DATA.DUR.settle + 220, easing: DATA.EASE.settle, fill:'none'});
      val.classList.add('live');
    }
    val.textContent = DATA.LINE_CN[i] + '爻 · ' + v + ' ' + DATA.VAL_NAME[v] + (moving ? ' · 动' : '');

    values.push(v); bits.push(bit); moves.push(moving);
    counter.textContent = String(i + 1);
    STORE.set({values:values.slice(), bits:bits.slice(), moves:moves.slice()});

    await ANIM.sleep(i < 5 ? 300 : 480);
    if(!ANIM.alive(epoch)) return;
  }

  FSM.goto('settle');
};

// 跳过：直接落定，不做逐爻动画
PLAYS.cast.instant = async function(){
  const values = [];
  for(let i = 0; i < 6; i++) values.push(RULES.drawValue());
  STORE.set({values, bits: RULES.bitsOfValues(values), moves: RULES.movingOfValues(values)});
  FSM.goto('settle');
};

/* --- 屏 4 · 成卦 --------------------------------------------------------- */
PLAYS.settle = async function(){
  const epoch = ANIM.cur();
  const st = STORE.state;
  if(!st.bits.length) return;

  const pair = UTIL.qs('#settle-pair');
  const subEl = UTIL.qs('#settle-sub');
  pair.innerHTML = '';

  const mkCol = (cap, bitsArr, moving) => {
    const col = document.createElement('div'); col.className = 'col';
    col.append(Object.assign(document.createElement('div'), {className:'cap', textContent:cap}));
    const box = document.createElement('div'); box.className = 'hex-box';
    const sheen = document.createElement('div'); sheen.className = 'sheen';
    sheen.append(document.createElement('i'));
    const hex = RENDER.stackEl(bitsArr, moving ? {moves: st.moves} : {});
    hex.dataset.phase = 'settled';
    box.append(sheen, hex);
    // ★ 卦名放在各自的框下方（本卦、之卦都要有）
    const nm = document.createElement('div'); nm.className = 'hex-name';
    nm.textContent = RULES.bitsToName(bitsArr);
    col.append(box, nm);
    return {col, box, sheen, hex, nm};
  };

  const hasMove = st.moves.some(Boolean);
  const zbits = hasMove ? RULES.zhiBits(st.bits, st.moves) : null;

  const A = mkCol('本卦', st.bits, true);
  pair.append(A.col);
  let B = null;
  if(hasMove){
    const arrow = document.createElement('div'); arrow.className = 'arrow'; arrow.textContent = '→';
    pair.append(arrow);
    B = mkCol('之卦', zbits, false);
    pair.append(B.col);
  }

  // 落定：六爻自下而上归位
  UTIL.qsa('.yao', A.hex).forEach((y,i) => ANIM.play(y,
    [{opacity:0, transform:'translateY(-14px)'}, {opacity:1, transform:'translateY(0)'}],
    {duration:260, delay:i*55, easing:DATA.EASE.drop, fill:'none'}));
  await ANIM.sleep(260 + 5*55);
  if(!ANIM.alive(epoch)) return;

  // 光泽横扫
  ANIM.play(A.sheen.firstElementChild,
    [{transform:'translateX(0) skewX(-18deg)'}, {transform:'translateX(420%) skewX(-18deg)'}],
    {duration:760, easing:DATA.EASE.settle, fill:'none'});

  if(B){
    UTIL.qsa('.yao', B.hex).forEach((y,i) => ANIM.play(y, [{opacity:0},{opacity:1}],
      {duration:240, delay:330 + i*30, fill:'none'}));
  }

  const movingNames = st.moves.map((m,i) => m ? DATA.LINE_CN[i] : null).filter(Boolean);
  subEl.textContent = hasMove
    ? '动爻 ' + movingNames.join('、') + ' · 之 ' + RULES.bitsToName(zbits)
    : '六爻皆静 · 无之卦';

  await ANIM.sleep(140);
  if(!ANIM.alive(epoch)) return;
  ANIM.play(A.nm, [{opacity:0, transform:'translateY(10px)'}, {opacity:1, transform:'translateY(0)'}],
    {duration:520, fill:'none'});
  if(B) ANIM.play(B.nm, [{opacity:0, transform:'translateY(10px)'}, {opacity:1, transform:'translateY(0)'}],
    {duration:520, delay:120, fill:'none'});
  ANIM.play(subEl, [{opacity:0},{opacity:1}], {duration:520, delay:220, fill:'none'});
};

/* --- 屏 5 · 错综演算 ----------------------------------------------------- */
PLAYS.network = function(){
  STAGE.init(ANIM.cur());
};

/* ==========================================================================
   EVENTS —— 输入 → FSM / GROW / STAGE 指令
   ========================================================================== */
const EVENTS = (() => {
  const {qs, qsa} = UTIL;

  // 屏 0：单击一下即进入（不再长按）
  function bindRest(){
    const t = qs('.taiji');
    if(!t) return;
    const fire = () => {
      if(FSM.busy || FSM.current !== 'rest') return;
      FSM.withBusy(() => { STORE.reset(); FSM.goto('generate'); });
    };
    t.addEventListener('click', fire);
    t.addEventListener('keydown', e => {
      if(e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault(); fire();
    });
  }

  // 屏 1：事件委托到带 data-node 的 SVG <g>
  function bindGrow(){
    const svg = qs('#gen-svg');
    if(!svg) return;
    svg.addEventListener('click', e => {
      const g = e.target.closest('[data-node]');
      if(!g) return;
      GROW.click(+g.dataset.node);
    });
    svg.addEventListener('keydown', e => {
      if(e.key !== 'Enter' && e.key !== ' ') return;
      const g = e.target.closest('[data-node]');
      if(!g) return;
      e.preventDefault();
      GROW.click(+g.dataset.node);
    });
  }

  // 屏 5：点击卡片 → 演算（不再是 hover）
  function bindNetwork(){
    const board = qs('.net-board');
    if(!board) return;
    board.addEventListener('click', e => {
      const card = e.target.closest('.card');
      if(!card) return;
      const v = STORE.state.variants.find(x => x.slot === card.dataset.slot);
      if(v) STAGE.select(v);
    });
    window.addEventListener('resize', UTIL.debounce(() => {
      if(FSM.current === 'network') STAGE.measure();
    }, 140));
  }

  function bindChrome(){
    qs('#skip').addEventListener('click', () => FSM.skip());

    qs('#to-cast').addEventListener('click', () => {
      FSM.withBusy(() => { FSM.goto('cast'); });
    });

    qs('#to-network').addEventListener('click', () => {
      FSM.withBusy(() => { FSM.goto('network'); });
    });

    qs('#restart').addEventListener('click', () => {
      FSM.withBusy(() => { STORE.reset(); FSM.goto('rest'); });
    });

    document.addEventListener('keydown', e => {
      if(e.key === 'Escape') FSM.skip();
    });
  }

  return {bindRest, bindGrow, bindNetwork, bindChrome};
})();

/* ==========================================================================
   BOOT
   ========================================================================== */
(function boot(){
  EVENTS.bindRest();
  EVENTS.bindGrow();
  EVENTS.bindNetwork();
  EVENTS.bindChrome();
  FSM.goto('rest');

  // 调试入口：index.html?debug 打印规则自检
  window.YI = {DATA, RULES, STORE, RENDER, ANIM, GROW, STAGE, FSM, PLAYS};

  if(location.search.indexOf('debug') >= 0){
    const t = (label, ok) => console.log((ok ? '✓ ' : '✗ ') + label);
    t('乾 111111 → 乾为天', RULES.bitsToName([1,1,1,1,1,1]) === '乾为天');
    t('坤 000000 → 坤为地', RULES.bitsToName([0,0,0,0,0,0]) === '坤为地');
    t('地天泰 = 7',        RULES.bitsToValue([1,1,1,0,0,0]) === 8);
    t('天地否 = 56',       RULES.bitsToValue([0,0,0,1,1,1]) === 56);
    t('水火既济',          RULES.bitsToName([1,0,1,0,1,0]) === '水火既济');
    t('山水蒙',            RULES.bitsToName([0,1,0,0,0,1]) === '山水蒙');

    t('先天生成序 = 乾兑离震巽坎艮坤',
      RULES.generationOrder().map(x => x.name).join('') === '乾兑离震巽坎艮坤');
    t('bitsToTrigram([1,1,1]) → 乾', RULES.bitsToTrigram([1,1,1]).name === '乾');
    t('bitsToTrigram([0,1,0]) → 坎', RULES.bitsToTrigram([0,1,0]).name === '坎');
    t('bitsToSixiang([1,1]) → 太阳', RULES.bitsToSixiang([1,1]) === '太阳');
    t('bitsToSixiang([1,0]) → 少阴', RULES.bitsToSixiang([1,0]) === '少阴');
    t('bitsToSixiang([0,1]) → 少阳', RULES.bitsToSixiang([0,1]) === '少阳');
    t('bitsToSixiang([0,0]) → 太阴', RULES.bitsToSixiang([0,0]) === '太阴');

    const vs = RULES.buildVariants([1,0,1,0,1,0]);
    t('15 格系统', vs.length === 15);
    t('  └ 变卦 6', vs.filter(v => v.kind === 'bian').length === 6);
    t('  └ 互卦 5', vs.filter(v => v.kind === 'hu').length === 5);
    t('水火既济 · 综 → 火水未济', vs.find(v=>v.kind==='zong').name === '火水未济');
    t('水火既济 · 错 → 火水未济', vs.find(v=>v.kind==='cuo').name === '火水未济');
    t('水火既济 · 互(去初上) → 火水未济',
      vs.find(v => v.slot === 'hu-chushang').name === '火水未济');

    // 生演不变量：第 d 层恰好 2^d 个互不相同的节点
    (function(){
      const kids = n => n.kids;
      const childBit = (p, k) => k === 0 ? (Math.random() < .5 ? 1 : 0) : 1 - kids(p)[0].bit;
      let layer = [{bits:[], kids:[]}];
      let ok = true;
      for(let d = 1; d <= 3; d++){
        const next = [];
        layer.forEach(p => {
          for(let k = 0; k < 2; k++){
            const bit = childBit(p, k);
            const child = {bits: p.bits.concat([bit]), bit, kids: []};
            p.kids.push(child);
            next.push(child);
          }
        });
        const uniq = new Set(next.map(n => n.bits.join('')));
        if(next.length !== (1 << d) || uniq.size !== (1 << d)) ok = false;
        layer = next;
      }
      t('生演：每层恰好 2^d 个互不相同的节点', ok);
    })();

    const counts = {6:0,7:0,8:0,9:0}, N = 160000;
    for(let i = 0; i < N; i++) counts[RULES.drawValue()]++;
    t('大衍 老阴 ≈ 6.25%', Math.abs(counts[6]/N - .0625) < .005);
    t('大衍 少阳 ≈ 31.25%', Math.abs(counts[7]/N - .3125) < .006);
    t('大衍 少阴 ≈ 43.75%', Math.abs(counts[8]/N - .4375) < .006);
    t('大衍 老阳 ≈ 18.75%', Math.abs(counts[9]/N - .1875) < .005);
  }
})();
</script>

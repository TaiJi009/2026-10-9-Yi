<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>卜易 · 太极生演至六十四卦</title>
<style>
/* ==========================================================================
   TOKENS —— 明度阶梯（tone ramp）与节奏常量
   全站仅用黑白灰，靠明度分层承载语义。
   ========================================================================== */
:root{
  --t0:#06060a; --t1:#0c0c11; --t2:#15151b; --t3:#212128; --t4:#32323b;
  --t5:#4a4a55; --t6:#6c6c78; --t7:#9898a6; --t8:#c8c8d4; --t9:#ececf3; --w:#fff;

  --ink:#8f8f9c;        /* 静爻 */
  --ink-hi:#e8e8ef;     /* 落定爻 */
  --ink-max:#ffffff;    /* 动爻 */

  --ease-settle:cubic-bezier(.4,0,.2,1);

  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --font-cn:"Songti SC","STSong","Noto Serif SC",Georgia,serif;

  --ygap:12px; --yh:15px; --yw:170px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--t0);color:var(--t8);font-family:var(--font-ui);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
/* 极淡网格 + 中心暗角，给"虚空"一点质感 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
  background-size:64px 64px, 64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 18%, transparent 76%);
  mask-image:radial-gradient(circle at 50% 50%, #000 18%, transparent 76%);
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 50%, transparent 28%, rgba(0,0,0,.74) 100%);
}

/* ==========================================================================
   LAYOUT —— 舞台与五屏
   ========================================================================== */
#stage{position:fixed;inset:0;z-index:1}
.screen{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;padding:24px;
  transition:opacity .42s var(--ease-settle);
}
.screen.active{opacity:1;pointer-events:auto}

.hint{
  position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  font-size:12px;letter-spacing:.32em;color:var(--t6);white-space:nowrap;
}
.hint b{color:var(--t8);font-weight:400}

/* ==========================================================================
   YAO —— 全站唯一的图形原子
   阳爻 = 两段 scaleX(1) 拼成实线；阴爻 = 两段 scaleX(.88)，中缝裂开。
   翻爻只 morph scaleX，无 DOM 交换、无 reflow。
   ========================================================================== */
.stack{display:flex;flex-direction:column-reverse;gap:var(--ygap);width:var(--yw)}
.yao{position:relative;width:100%;height:var(--yh);flex:none}
.yao .seg{position:absolute;top:0;height:100%;width:50%;background:var(--ink);border-radius:1px}
.yao .seg-l{left:0;transform-origin:0 50%}
.yao .seg-r{left:50%;transform-origin:100% 50%}
.yao[data-yang="0"] .seg{transform:scaleX(.88)}

.yao .glow{
  position:absolute;inset:-4px -3px;border-radius:3px;
  background:var(--ink-max);filter:blur(5px);opacity:0;pointer-events:none;
}
.yao .mark{
  position:absolute;right:calc(100% + 10px);top:50%;transform:translateY(-50%);
  font-family:var(--font-cn);font-size:15px;line-height:1;color:var(--ink-max);opacity:0;
}
.yao[data-moving="1"] .mark{opacity:.9}

.yao[data-ghost="1"]{opacity:.16}

.stack[data-phase="settled"] .yao[data-moving="0"] .seg{background:var(--ink-hi)}
.stack[data-phase="settled"] .yao[data-moving="1"] .seg{background:var(--ink-max)}
.stack[data-phase="settled"] .yao[data-moving="1"] .glow{opacity:.55;animation:breathe 2.2s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.32}50%{opacity:.78}}

/* 高亮档（第4屏交互） */
.yao[data-hot="hot"] .seg{background:var(--ink-max)}
.yao[data-hot="hot"] .glow{opacity:.7}
.yao[data-hot="dim"] .seg{background:var(--t3)}
.yao[data-hot="kept"] .seg,
.yao[data-hot="grpA"] .seg,
.yao[data-hot="grpB"] .seg{background:var(--w);box-shadow:0 0 11px rgba(255,255,255,.32)}
.yao[data-hot="grpA"]::after,
.yao[data-hot="grpB"]::after{
  content:"";position:absolute;left:-9px;right:-9px;top:-5px;bottom:-5px;
  border:1px solid rgba(255,255,255,.45);border-radius:2px;
  animation:grpPulse .95s ease-in-out infinite;
}
.yao[data-hot="grpB"]::after{border-style:dashed}
@keyframes grpPulse{0%,100%{opacity:.42}50%{opacity:1}}

/* ==========================================================================
   SCREEN 0 —— 静 · 太极
   ========================================================================== */
.taiji{
  width:206px;height:206px;position:relative;z-index:2;
  cursor:pointer;outline:none;display:block;
  filter:drop-shadow(0 0 26px rgba(255,255,255,.14));
  animation:taijiBreathe 5.2s ease-in-out infinite;
}
@keyframes taijiBreathe{
  0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(255,255,255,.10))}
  50%{transform:scale(1.04);filter:drop-shadow(0 0 40px rgba(255,255,255,.22))}
}
#rest .halo{
  position:absolute;width:340px;height:340px;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(255,255,255,.085) 0%, transparent 68%);
  animation:haloBreathe 5.2s ease-in-out infinite;
}
@keyframes haloBreathe{0%,100%{opacity:.55}50%{opacity:1}}
.taiji svg{width:100%;height:100%;display:block;border-radius:50%}
#rest .ring{
  position:absolute;width:344px;height:344px;border-radius:50%;pointer-events:none;
  background:conic-gradient(from -90deg, rgba(255,255,255,.92) var(--p,0deg), rgba(255,255,255,.05) 0deg);
  -webkit-mask:radial-gradient(circle, transparent 81%, #000 81.5%, #000 86%, transparent 86.5%);
  mask:radial-gradient(circle, transparent 81%, #000 81.5%, #000 86%, transparent 86.5%);
}

/* ==========================================================================
   SCREEN 1 —— 生演
   ========================================================================== */
#gen-svg{width:min(100%,1000px);max-height:86vh}
.gen-node{color:#c8c8d4}
.gen-link{stroke:var(--t4);stroke-width:1;fill:none;stroke-dasharray:1;stroke-dashoffset:1}
.gen-label{fill:var(--t7);font-family:var(--font-cn);font-size:15px;text-anchor:middle}
.gen-label.dim{fill:var(--t5);font-size:13px}

/* ==========================================================================
   SCREEN 2 —— 起卦
   ========================================================================== */
.cast-wrap{display:flex;flex-direction:column;align-items:center;gap:26px}
.cast-head{font-size:12.5px;letter-spacing:.34em;color:var(--t6);display:flex;gap:20px;align-items:baseline}
.cast-head b{color:var(--t9);font-family:var(--font-cn);font-size:22px;letter-spacing:.08em;font-weight:400}
.cast-stack{display:flex;flex-direction:column-reverse;gap:15px;width:200px}
.slot{display:flex;align-items:center;gap:20px}
.slot .yao{flex:none;width:200px;height:16px}
.slot .val{
  font-family:var(--font-cn);font-size:13px;color:var(--t6);
  white-space:nowrap;min-width:118px;letter-spacing:.1em;
}
.slot .val.live{color:var(--t9)}

/* ==========================================================================
   SCREEN 3 —— 成卦
   ========================================================================== */
.settle-wrap{display:flex;flex-direction:column;align-items:center;gap:32px}
.pair{display:flex;align-items:center;gap:48px}
.pair .col{display:flex;flex-direction:column;align-items:center;gap:15px}
.pair .cap{font-size:11px;letter-spacing:.3em;color:var(--t6)}
.arrow{font-size:19px;color:var(--t5)}
.hex-box{position:relative;padding:20px 30px;border:1px solid var(--t2);border-radius:3px}
.sheen{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:3px}
.sheen i{
  position:absolute;top:-40%;left:-60%;width:36%;height:180%;display:block;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.17),transparent);
  transform:skewX(-18deg);
}
.hex-name{font-family:var(--font-cn);font-size:36px;letter-spacing:.3em;color:var(--t9);opacity:0}
.hex-sub{font-size:12px;letter-spacing:.34em;color:var(--t6);opacity:0;text-align:center}

/* ==========================================================================
   SCREEN 4 —— 错综 · 十五卦
   ========================================================================== */
#network{flex-direction:column;gap:12px}
.net-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
.net-title{font-family:var(--font-cn);font-size:15px;letter-spacing:.3em;color:var(--t7)}
.net-btn{
  font-family:var(--font-ui);font-size:12px;letter-spacing:.2em;
  color:var(--t8);background:transparent;border:1px solid var(--t4);
  padding:7px 15px;border-radius:2px;cursor:pointer;
  transition:border-color .25s,color .25s,background .25s;
}
.net-btn:hover{color:var(--w);border-color:var(--t7);background:rgba(255,255,255,.045)}
.net-btn[aria-pressed="true"]{color:var(--t0);background:var(--t8);border-color:var(--t8)}

.net-stage{position:relative;width:min(100%,1180px);height:min(70vh,660px)}
.net-links{position:absolute;inset:0;overflow:visible;z-index:1}
.net-links path{fill:none;stroke:var(--t3);stroke-width:1;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke .25s}
.net-links path.on{stroke:var(--t8)}

.net-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:13px;z-index:3;
}
.center-wrap{position:relative}
.net-center .yao-stack{--yw:184px;--yh:16px;--ygap:14px}
.net-center-name{font-family:var(--font-cn);font-size:19px;letter-spacing:.26em;color:var(--t9)}
.net-center-cap{font-size:10.5px;letter-spacing:.34em;color:var(--t6)}

/* 互卦抽取括号 */
.bracket{
  position:absolute;width:9px;opacity:0;top:0;height:0;
  border:1px solid rgba(255,255,255,.6);transition:opacity .22s;
}
.bracket.l{left:-17px;border-right:none}
.bracket.r{right:-17px;border-left:none}
.bracket.on{opacity:.92}

.net-cards{position:absolute;inset:0;z-index:2}
.card{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 10px;min-width:100px;
  background:rgba(10,10,14,.74);border:1px solid var(--t2);border-radius:3px;
  font-family:var(--font-ui);color:inherit;cursor:pointer;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  transition:border-color .22s,background .22s,transform .22s var(--ease-settle);
  opacity:0;
}
.card:hover,.card:focus-visible{
  border-color:var(--t7);background:rgba(24,24,30,.95);outline:none;
  transform:translate(-50%,-50%) scale(1.06);z-index:6;
}
.card .mini{display:flex;flex-direction:column-reverse;gap:3.5px;width:68px}
.card .mini .yao{height:4.5px;width:68px}
.card .mini .seg{background:var(--t7);border-radius:.5px}
.card .c-label{font-size:10px;letter-spacing:.18em;color:var(--t6)}
.card .c-name{font-family:var(--font-cn);font-size:13.5px;letter-spacing:.1em;color:var(--t8)}
.card[data-kind="ben"] .c-name{color:var(--w)}
.card .c-badge{
  visibility:hidden;font-size:9.5px;letter-spacing:.12em;color:var(--t6);
  border:1px solid var(--t4);border-radius:2px;padding:1px 5px;
}
.card[data-dup="1"] .c-badge{visibility:visible}
.card[data-hot="1"]{border-color:var(--w);background:rgba(32,32,40,.96)}

/* 分组视图 */
.net-grid{
  display:none;width:min(100%,1180px);max-height:72vh;overflow:auto;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding:4px;
}
.net-grid.on{display:grid}
.net-stage.off{display:none}
.ncol{display:flex;flex-direction:column;gap:9px;min-width:0}
.ncol h4{
  font-family:var(--font-cn);font-size:12.5px;letter-spacing:.24em;color:var(--t6);
  font-weight:400;padding-bottom:7px;border-bottom:1px solid var(--t2);
}
.ncol .card{position:static;transform:none;opacity:1;min-width:0;width:100%}
.ncol .card:hover{transform:translateY(-2px)}

/* ==========================================================================
   HUD
   ========================================================================== */
#skip{
  position:fixed;right:24px;bottom:24px;z-index:9;
  font-family:var(--font-ui);font-size:11.5px;letter-spacing:.28em;
  color:var(--t6);background:transparent;border:1px solid var(--t3);
  padding:8px 16px;border-radius:2px;cursor:pointer;
  opacity:0;pointer-events:none;transition:opacity .3s,color .25s,border-color .25s;
}
#skip.on{opacity:1;pointer-events:auto}
#skip:hover{color:var(--w);border-color:var(--t7)}

@media (prefers-reduced-motion: reduce){
  .taiji{animation:none}
  .stack[data-phase="settled"] .yao[data-moving="1"] .glow{animation:none;opacity:.6}
}

@media (max-width: 900px){
  #network{justify-content:flex-start;overflow:auto}
  .net-stage{height:auto;width:100%}
  .net-links{display:none}
  .net-center{position:static;transform:none;margin:0 auto 20px}
  .net-cards{position:static;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .card{position:static;transform:none !important;opacity:1;min-width:0}
  .net-grid.on{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>

<main id="stage">

  <!-- 屏 0 · 静 -->
  <section class="screen" data-screen="rest" id="rest">
    <div class="halo" aria-hidden="true"></div>
    <div class="ring" aria-hidden="true"></div>
    <div class="taiji" role="button" tabindex="0" aria-label="长按起卦">
      <svg viewBox="-100 -100 200 200" aria-hidden="true">
        <defs><clipPath id="taijiClip"><circle cx="0" cy="0" r="100"/></clipPath></defs>
        <g clip-path="url(#taijiClip)">
          <circle cx="0" cy="0" r="100" fill="#0b0b0f"/>
          <!-- 白：右半圆 + 下方小圆（成 S 形分界） -->
          <path d="M0,-100 A100,100 0 0 1 0,100 Z" fill="#f2f2f7"/>
          <!-- 黑鱼头：上方小圆 -->
          <circle cx="0" cy="-50" r="50" fill="#0b0b0f"/>
          <!-- 白鱼头：下方小圆 -->
          <circle cx="0" cy="50" r="50" fill="#f2f2f7"/>
          <!-- 鱼眼 -->
          <circle cx="0" cy="-50" r="13" fill="#f2f2f7"/>
          <circle cx="0" cy="50" r="13" fill="#0b0b0f"/>
        </g>
        <circle cx="0" cy="0" r="99" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1.4"/>
      </svg>
    </div>
    <p class="hint">长按太极 · <b>起卦</b></p>
  </section>

  <!-- 屏 1 · 生演 -->
  <section class="screen" data-screen="generate">
    <svg id="gen-svg" viewBox="0 0 1000 796" preserveAspectRatio="xMidYMid meet"
         role="img" aria-label="太极生演至六十四卦"></svg>
    <p class="hint">生演 · <b>太极 → 两仪 → 四象 → 八卦 → 六十四卦</b></p>
  </section>

  <!-- 屏 2 · 起卦 -->
  <section class="screen" data-screen="cast">
    <div class="cast-wrap">
      <div class="cast-head">摇卦 <b><span id="cast-n">0</span> / 6</b></div>
      <div class="cast-stack" id="cast-stack"></div>
    </div>
    <p class="hint">六爻 · <b>自下而上</b></p>
  </section>

  <!-- 屏 3 · 成卦 -->
  <section class="screen" data-screen="settle">
    <div class="settle-wrap">
      <div class="pair" id="settle-pair"></div>
      <div class="hex-name" id="settle-name"></div>
      <div class="hex-sub" id="settle-sub"></div>
      <button class="net-btn" id="to-network">展开错综 · 十五卦</button>
    </div>
  </section>

  <!-- 屏 4 · 错综 -->
  <section class="screen" data-screen="network" id="network">
    <div class="net-toolbar">
      <span class="net-title">错综 · 十五卦</span>
      <button class="net-btn" id="toggle-view" aria-pressed="false">分组视图</button>
      <button class="net-btn" id="restart">重新起卦</button>
    </div>
    <div class="net-stage" id="net-stage">
      <svg class="net-links" id="net-links" preserveAspectRatio="none"></svg>
      <div class="net-center" id="net-center">
        <div class="center-wrap">
          <div class="yao-stack" id="center-hex"></div>
          <div class="bracket l" id="br-l"></div>
          <div class="bracket r" id="br-r"></div>
        </div>
        <div class="net-center-name" id="center-name"></div>
        <div class="net-center-cap">本卦</div>
      </div>
      <div class="net-cards" id="net-cards"></div>
    </div>
    <div class="net-grid" id="net-grid"></div>
  </section>

</main>

<button id="skip">跳过</button>

<script>
/* ==========================================================================
   DATA —— 纯查表与常量
   ========================================================================== */
const DATA = (() => {
  // 三爻卦：值 = b0 + b1*2 + b2*4（b0 为初爻 / 最下）
  const TRIGRAM = [
    {v:0, name:'坤', sym:'☷', bits:[0,0,0]},
    {v:1, name:'震', sym:'☳', bits:[1,0,0]},
    {v:2, name:'坎', sym:'☵', bits:[0,1,0]},
    {v:3, name:'兑', sym:'☱', bits:[1,1,0]},
    {v:4, name:'艮', sym:'☶', bits:[0,0,1]},
    {v:5, name:'离', sym:'☲', bits:[1,0,1]},
    {v:6, name:'巽', sym:'☴', bits:[0,1,1]},
    {v:7, name:'乾', sym:'☰', bits:[1,1,1]},
  ];

  // 64 卦全名：下标 = 下卦(内)值 + 上卦(外)值 * 8；行 = 上卦，列 = 下卦
  const HEX = [
  //   下坤     下震     下坎     下兑     下艮     下离     下巽     下乾
    '坤为地','地雷复','地水师','地泽临','地山谦','地火明夷','地风升','地天泰', // 上坤
    '雷地豫','震为雷','雷水解','雷泽归妹','雷山小过','雷火丰','雷风恒','雷天大壮', // 上震
    '水地比','水雷屯','坎为水','水泽节','水山蹇','水火既济','水风井','水天需', // 上坎
    '泽地萃','泽雷随','泽水困','兑为泽','泽山咸','泽火革','泽风大过','泽天夬', // 上兑
    '山地剥','山雷颐','山水蒙','山泽损','艮为山','山火贲','山风蛊','山天大畜', // 上艮
    '火地晋','火雷噬嗑','火水未济','火泽睽','火山旅','离为火','火风鼎','火天大有', // 上离
    '风地观','风雷益','风水涣','风泽中孚','风山渐','风火家人','巽为风','风天小畜', // 上巽
    '天地否','天雷无妄','天水讼','天泽履','天山遯','天火同人','天风姤','乾为天', // 上乾
  ];

  const SIXIANG = ['太阳','少阴','少阳','太阴'];
  const LINE_CN = ['初','二','三','四','五','上'];

  // 大衍筮法：老阴 6 / 少阳 7 / 少阴 8 / 老阳 9
  const LINE_PROB = {6:1/16, 7:5/16, 8:7/16, 9:3/16};
  const VAL_NAME  = {6:'老阴', 7:'少阳', 8:'少阴', 9:'老阳'};

  // 互卦五种变法
  const HU_MODES = [
    {key:'chu',     label:'去初',   removed:[0],   lower:[1,2,3], upper:[3,4,5]},
    {key:'shang',   label:'去上',   removed:[5],   lower:[0,1,2], upper:[2,3,4]},
    {key:'chushang',label:'去初上', removed:[0,5], lower:[1,2,3], upper:[2,3,4]},
    {key:'chuer',   label:'去初二', removed:[0,1], lower:[2,3,4], upper:[3,4,5]},
    {key:'wushang', label:'去五上', removed:[4,5], lower:[0,1,2], upper:[1,2,3]},
  ];

  // 第4屏槽位（位置本身承载语义）：
  //   左列 变卦阶梯，高度 = 所变爻位（初爻最低、上爻最高）
  //   顶部 综（颠倒）· 右侧 交（上下互换）/ 错（全反）· 底部横排 互（去爻抽取）
  const SLOTS = [
    {slot:'bian0', kind:'bian', line:0, x:12, y:84.5},
    {slot:'bian1', kind:'bian', line:1, x:12, y:71.0},
    {slot:'bian2', kind:'bian', line:2, x:12, y:57.5},
    {slot:'bian3', kind:'bian', line:3, x:12, y:44.0},
    {slot:'bian4', kind:'bian', line:4, x:12, y:30.5},
    {slot:'bian5', kind:'bian', line:5, x:12, y:17.0},
    {slot:'zong', kind:'zong', x:50, y:11},
    {slot:'cuo',  kind:'cuo',  x:87.5, y:26},
    {slot:'jiao', kind:'jiao', x:87.5, y:74},
    {slot:'hu-chu',     kind:'hu', x:25, y:85.5},
    {slot:'hu-shang',   kind:'hu', x:38, y:87},
    {slot:'hu-chushang',kind:'hu', x:51, y:87},
    {slot:'hu-chuer',   kind:'hu', x:64, y:87},
    {slot:'hu-wushang', kind:'hu', x:77, y:85.5},
  ];

  const DUR = {charge:520, drop:250, settle:220, flip:340, rotate:620, genStep:130};
  const EASE = {
    charge:'cubic-bezier(.5,0,.8,.2)',
    drop:'cubic-bezier(.2,.9,.25,1.15)',
    settle:'cubic-bezier(.4,0,.2,1)',
  };

  return {TRIGRAM, HEX, SIXIANG, LINE_CN, LINE_PROB, VAL_NAME, HU_MODES, SLOTS, DUR, EASE};
})();

/* ==========================================================================
   RULES —— 纯函数，无 DOM、无副作用
   ========================================================================== */
const RULES = (() => {
  const triVal     = (b0,b1,b2) => b0 + b1*2 + b2*4;
  const lowerVal   = b => triVal(b[0],b[1],b[2]);
  const upperVal   = b => triVal(b[3],b[4],b[5]);
  const bitsToValue= b => lowerVal(b) + upperVal(b)*8;
  const bitsToName = b => DATA.HEX[bitsToValue(b)];
  const lowerTri   = b => DATA.TRIGRAM[lowerVal(b)];
  const upperTri   = b => DATA.TRIGRAM[upperVal(b)];

  const isMovingVal   = v => v === 6 || v === 9;
  const bitsOfValues  = vs => vs.map(v => (v === 7 || v === 9) ? 1 : 0);
  const movingOfValues= vs => vs.map(isMovingVal);

  const flipLine     = (b,i) => b.map((x,j) => j === i ? (x ? 0 : 1) : x);
  const invertAll    = b => b.map(x => x ? 0 : 1);
  const reverseBits  = b => b.slice().reverse();
  const swapTrigrams = b => [b[3],b[4],b[5],b[0],b[1],b[2]];
  const diffLines    = (a,b) => a.map((x,i) => x !== b[i] ? i : -1).filter(i => i >= 0);

  const huBuild = (b,m) => [...m.lower.map(i => b[i]), ...m.upper.map(i => b[i])];

  // 大衍筮法抽一爻：返回 6 / 7 / 8 / 9（1:5:7:3）
  function drawValue(){
    const r = Math.random();
    if(r < 1/16) return 6;
    if(r < 6/16) return 7;
    if(r < 13/16) return 8;
    return 9;
  }

  // 本卦 + 14 变体 = 15 格系统
  function buildVariants(bits){
    const out = [];
    const push = o => {
      o.bits = o.bits.slice();
      o.name = bitsToName(o.bits);
      out.push(o);
    };

    push({slot:'ben', kind:'ben', label:'本卦', bits, changedLines:[], hlMode:'none'});

    for(let i = 0; i < 6; i++){
      push({slot:'bian'+i, kind:'bian', line:i, label:'变·' + DATA.LINE_CN[i] + '爻',
            bits: flipLine(bits,i), changedLines:[i], hlMode:'lines'});
    }
    push({slot:'zong', kind:'zong', label:'综卦 · 倒转', bits: reverseBits(bits),
          changedLines: diffLines(bits, reverseBits(bits)), hlMode:'rotate'});
    push({slot:'cuo',  kind:'cuo',  label:'错卦 · 全反', bits: invertAll(bits),
          changedLines: diffLines(bits, invertAll(bits)), hlMode:'all'});
    push({slot:'jiao', kind:'jiao', label:'交卦 · 上下互换', bits: swapTrigrams(bits),
          changedLines: diffLines(bits, swapTrigrams(bits)), hlMode:'trigramSwap'});

    DATA.HU_MODES.forEach(m => {
      const hb = huBuild(bits, m);
      push({slot:'hu-' + m.key, kind:'hu', label:'互 · ' + m.label, bits: hb,
            changedLines: diffLines(bits, hb), hlMode:'removeKept',
            hu:{lower:m.lower, upper:m.upper, removed:m.removed}});
    });

    return out;
  }

  // 之卦：动爻全变
  const zhiBits = (b,mv) => b.map((x,i) => mv[i] ? (x ? 0 : 1) : x);

  // 生演：第 d 层第 k 个节点，返回自下而上的 six 爻（新爻加在最上）
  function genBits(k,d){
    const out = [];
    for(let i = d - 1; i >= 0; i--) out.push(((k >> i) & 1) ? 0 : 1);
    return out;
  }
  // 生演序（先天）：乾坤兑离震巽坎艮
  const generationOrder = () => [7,3,5,1,6,2,4,0].map(i => DATA.TRIGRAM[i]);

  return {triVal, lowerVal, upperVal, bitsToValue, bitsToName, lowerTri, upperTri,
          isMovingVal, bitsOfValues, movingOfValues, flipLine, invertAll, reverseBits,
          swapTrigrams, diffLines, huBuild, drawValue, buildVariants, zhiBits, genBits,
          generationOrder};
})();

/* ==========================================================================
   STORE —— 单一状态 + 订阅
   ========================================================================== */
const STORE = (() => {
  const state = {values:[], bits:[], moves:[], variants:[], genPlayed:false};
  const subs = [];
  const api = {
    state,
    set(patch){ Object.assign(state, patch); subs.forEach(f => f(state)); },
    subscribe(f){ subs.push(f); },
    reset(){ api.set({values:[], bits:[], moves:[], variants:[]}); },
  };
  return api;
})();

/* ==========================================================================
   UTIL
   ========================================================================== */
const UTIL = (() => {
  const qs = (s, r = document) => r.querySelector(s);
  const qsa = (s, r = document) => Array.prototype.slice.call(r.querySelectorAll(s));
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const debounce = (fn, ms) => { let t; return function(){ const a = arguments; clearTimeout(t); t = setTimeout(() => fn.apply(null, a), ms); }; };
  const raf = fn => requestAnimationFrame(() => requestAnimationFrame(fn));
  return {qs, qsa, clamp, debounce, raf};
})();

/* ==========================================================================
   ANIM —— WAAPI 封装 + 全局注册表 + epoch 取消
   ========================================================================== */
const ANIM = (() => {
  const anims = new Set();
  let epoch = 0;
  const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  let mul = mq.matches ? 0.15 : 1;
  if(mq.addEventListener) mq.addEventListener('change', e => { mul = e.matches ? 0.15 : 1; });

  const d = ms => Math.max(16, Math.round(ms * mul));

  function reg(a){
    anims.add(a);
    a.finished.catch(() => {}).then(() => anims.delete(a));
    return a;
  }
  function cancelAll(){
    epoch++;
    anims.forEach(a => { try { a.cancel(); } catch(e){} });
    anims.clear();
  }
  const cur = () => epoch;
  const alive = e => e === epoch;

  function play(el, kf, opt){
    opt = opt || {};
    return reg(el.animate(kf, {
      duration: d(opt.duration != null ? opt.duration : 300),
      delay: d(opt.delay || 0),
      easing: opt.easing || DATA.EASE.settle,
      fill: opt.fill || 'both',
    }));
  }
  const await_ = a => a.finished.catch(() => {});
  const sleep = ms => new Promise(r => setTimeout(r, d(ms)));

  return {reg, cancelAll, cur, alive, play, await_, sleep, d, reduced: () => mq.matches};
})();

/* ==========================================================================
   RENDER —— 数据 → DOM
   ========================================================================== */
const RENDER = (() => {
  const {qs, qsa} = UTIL;

  function yaoEl(bit, opts){
    opts = opts || {};
    const el = document.createElement('div');
    el.className = 'yao';
    el.dataset.yang = bit ? '1' : '0';
    if(opts.moving) el.dataset.moving = '1';
    if(opts.ghost)  el.dataset.ghost  = '1';

    const glow = document.createElement('i'); glow.className = 'glow';
    const l = document.createElement('i'); l.className = 'seg seg-l';
    const r = document.createElement('i'); r.className = 'seg seg-r';
    el.append(glow, l, r);

    if(opts.mark){
      const m = document.createElement('b'); m.className = 'mark'; m.textContent = opts.mark;
      el.append(m);
    }
    return el;
  }

  // 爻栈：index 0（初爻）在最下
  function stackEl(bits, opts){
    opts = opts || {};
    const s = document.createElement('div');
    s.className = 'yao-stack stack';
    fillStack(s, bits, opts);
    return s;
  }

  function fillStack(s, bits, opts){
    opts = opts || {};
    s.innerHTML = '';
    bits.forEach((b,i) => s.append(yaoEl(b, {
      moving: opts.moves ? opts.moves[i] : false,
      mark:   (opts.moves && opts.moves[i]) ? (b ? '○' : '×') : '',
    })));
    return s;
  }

  function miniEl(bits){
    const s = document.createElement('div');
    s.className = 'mini';
    bits.forEach(b => s.append(yaoEl(b)));
    return s;
  }

  // 一次性落定多组高亮：map = { 爻序号: 类名 }
  function hotMap(hexEl, map){
    qsa('.yao', hexEl).forEach((y,i) => {
      const cls = map[i];
      if(cls) y.dataset.hot = cls; else delete y.dataset.hot;
    });
  }
  function setHot(hexEl, indices, cls){
    qsa('.yao', hexEl).forEach((y,i) => {
      delete y.dataset.hot;
      if(indices.indexOf(i) >= 0) y.dataset.hot = cls;
    });
  }
  function clearHot(hexEl){ qsa('.yao', hexEl).forEach(y => { delete y.dataset.hot; }); }

  // 互卦抽取括号：把 range 这段爻框出来（列在下方的初爻 index 0）
  function setBracket(el, range, on){
    if(!on || !range.length){ el.classList.remove('on'); return; }
    const a = Math.min.apply(null, range), b = Math.max.apply(null, range);
    el.style.top    = ((5 - b) / 6 * 100) + '%';
    el.style.height = ((b - a + 1) / 6 * 100) + '%';
    el.classList.add('on');
  }

  return {yaoEl, stackEl, fillStack, miniEl, hotMap, setHot, clearHot, setBracket};
})();

/* ==========================================================================
   FSM —— 五屏路由 + 输入闸门 + 取消
   ========================================================================== */
const FSM = (() => {
  const SCREENS = ['rest','generate','cast','settle','network'];
  const PLAYS = {};
  let current = null;
  let busy = false;

  const screenEl = name => UTIL.qs('.screen[data-screen="' + name + '"]');

  function goto(name){
    ANIM.cancelAll();                 // 唯一解药：在飞的动画与 await 立即失效
    SCREENS.forEach(s => {
      const el = screenEl(s);
      if(el) el.classList.toggle('active', s === name);
    });
    const changed = current !== name;
    current = name;
    UTIL.qs('#skip').classList.toggle('on', name === 'generate' || name === 'cast');
    if(changed && PLAYS[name]) PLAYS[name]();
  }

  function withBusy(fn){
    if(busy) return Promise.resolve();
    busy = true;
    return Promise.resolve().then(fn).finally(() => { busy = false; });
  }

  async function skip(){
    if(current === 'generate'){ STORE.set({genPlayed:true}); goto('cast'); }
    else if(current === 'cast'){ await PLAYS.cast.instant(); }
  }

  return {
    goto, skip, withBusy, screenEl, SCREENS, PLAYS,
    get current(){ return current; },
    get busy(){ return busy; },
  };
})();

/* ==========================================================================
   PLAYS —— 各屏的动画编排
   ========================================================================== */
const PLAYS = FSM.PLAYS;
const SVGNS = 'http://www.w3.org/2000/svg';

/* --- 屏 1 · 生演 --------------------------------------------------------- */
PLAYS.generate = async function(){
  const epoch = ANIM.cur();
  const svg = UTIL.qs('#gen-svg');
  const full = !STORE.state.genPlayed;

  const W = 1000, Y0 = 70, RH = 110;
  const mk = (tag, attrs) => {
    const e = document.createElementNS(SVGNS, tag);
    for(const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  };
  const mkText = (attrs, text) => { const t = mk('text', attrs); t.textContent = text; return t; };

  // 竖排爻线：index 0（初爻）在最下
  const glyph = (bits, cx, cy, w, th, gap) => {
    const g = mk('g', {class:'gen-node'});
    const n = bits.length;
    const h = n * th + (n - 1) * gap;
    bits.forEach((b,i) => {
      const y = cy - h/2 + (n - 1 - i) * (th + gap);
      if(b){
        g.append(mk('rect', {x:cx - w/2, y, width:w, height:th, rx:.5, fill:'currentColor'}));
      }else{
        const seg = w * .44;
        g.append(mk('rect', {x:cx - w/2,        y, width:seg, height:th, rx:.5, fill:'currentColor'}));
        g.append(mk('rect', {x:cx + w/2 - seg,  y, width:seg, height:th, rx:.5, fill:'currentColor'}));
      }
    });
    return g;
  };

  svg.innerHTML = '';
  const nodes = [], links = [];

  // 0 太极 → 1 两仪 → 2 四象 → 3 八卦
  for(let d = 0; d <= 3; d++){
    const n = 1 << d;
    for(let k = 0; k < n; k++){
      const x = (k + .5) / n * W;
      const y = Y0 + d * RH;
      let g;
      if(d === 0){
        g = mk('g', {class:'gen-node'});
        g.append(mk('circle', {cx:x, cy:y, r:17, fill:'none', stroke:'#ececf3', 'stroke-width':1.6}));
        g.append(mk('path', {
          d:'M' + x + ',' + (y-17) +
            ' A17,17 0 0 1 ' + x + ',' + (y+17) +
            ' A8.5,8.5 0 0 1 ' + x + ',' + y +
            ' A8.5,8.5 0 0 0 ' + x + ',' + (y-17) + ' Z',
          fill:'#ececf3', opacity:.92
        }));
      }else{
        g = glyph(RULES.genBits(k, d), x, y, 46, 3.4, 6.5);
      }
      svg.append(g);
      nodes.push({g, x, y, d, k});
    }
  }

  // 连接线（先插入，压在节点之下）
  nodes.forEach(nd => {
    if(nd.d === 0) return;
    const p = nodes.find(o => o.d === nd.d - 1 && o.k === (nd.k >> 1));
    if(!p) return;
    const line = mk('line', {
      class:'gen-link', pathLength:'1',
      x1:p.x, y1:p.y + 22, x2:nd.x, y2:nd.y - 22
    });
    svg.insertBefore(line, svg.firstChild);
    links.push({line, d:nd.d});
  });

  // 层标签
  ['太极','两仪','四象','八卦'].forEach((t,d) => {
    svg.append(mkText({class:'gen-label dim', x:38, y:Y0 + d*RH + 5, 'text-anchor':'start'}, t));
  });
  // 四象名
  nodes.filter(n => n.d === 2).forEach((nd,k) => {
    svg.append(mkText({class:'gen-label', x:nd.x, y:nd.y + 42}, DATA.SIXIANG[k]));
  });
  // 八卦名（先天序：乾兑离震巽坎艮坤）
  const gen = RULES.generationOrder();
  nodes.filter(n => n.d === 3).forEach((nd,k) => {
    svg.append(mkText({class:'gen-label', x:nd.x, y:nd.y + 42}, gen[k].sym + ' ' + gen[k].name));
  });

  // 逐层点亮
  for(let d = 0; d <= 3; d++){
    const layer = nodes.filter(n => n.d === d);
    layer.forEach((nd,i) => {
      ANIM.play(nd.g, [{opacity:0}, {opacity:1}],
        {duration: full ? 320 : 90, delay: full ? i * (DATA.DUR.genStep / (d + 1)) : 0});
    });
    links.filter(l => l.d === d).forEach((l,i) => {
      ANIM.play(l.line, [{strokeDashoffset:1}, {strokeDashoffset:0}],
        {duration: full ? 300 : 80, delay: full ? i * (DATA.DUR.genStep / (d + 1)) : 0});
    });
    await ANIM.sleep(full ? 300 : 60);
    if(!ANIM.alive(epoch)) return;
  }

  await ANIM.sleep(full ? 400 : 60);
  if(!ANIM.alive(epoch)) return;

  // 重卦：八八六十四个六爻卦，绽放
  const CW = 42, CH = 34;
  const gx = (W - 8 * CW) / 2, gy = Y0 + 3 * RH + 78;
  const t0 = performance.now();
  for(let row = 0; row < 8; row++){
    for(let col = 0; col < 8; col++){
      const bits = DATA.TRIGRAM[col].bits.concat(DATA.TRIGRAM[7 - row].bits);
      const g = glyph(bits, gx + col*CW + CW/2, gy + row*CH + CH/2, 22, 1.6, 2.6);
      svg.append(g);
      ANIM.play(g, [{opacity:0}, {opacity:.92}],
        {duration: full ? 240 : 60, delay: full ? (row + col) * 26 : 0});
    }
  }
  for(let r = 0; r < 8; r++){
    svg.append(mkText({class:'gen-label dim', x:gx - 18, y:gy + r*CH + CH/2 + 4, 'text-anchor':'end'},
      DATA.TRIGRAM[7 - r].name));
  }
  for(let c = 0; c < 8; c++){
    svg.append(mkText({class:'gen-label dim', x:gx + c*CW + CW/2, y:gy - 16}, DATA.TRIGRAM[c].name));
  }

  await ANIM.sleep(full ? 1050 : 220);
  if(!ANIM.alive(epoch)) return;

  STORE.set({genPlayed:true});
  FSM.goto('cast');
};

/* --- 屏 2 · 起卦 --------------------------------------------------------- */
PLAYS.cast = async function(){
  const epoch = ANIM.cur();
  const stack = UTIL.qs('#cast-stack');
  const counter = UTIL.qs('#cast-n');
  const values = [], bits = [], moves = [];

  stack.innerHTML = '';
  const slots = [];
  for(let i = 0; i < 6; i++){
    const slot = document.createElement('div'); slot.className = 'slot';
    const yao = RENDER.yaoEl(0, {ghost:true});
    const val = document.createElement('span'); val.className = 'val';
    val.textContent = DATA.LINE_CN[i] + '爻';
    slot.append(yao, val);
    stack.append(slot);
    slots.push({slot, yao, val});
  }
  counter.textContent = '0';

  for(let i = 0; i < 6; i++){
    const {slot, yao, val} = slots[i];
    const v = RULES.drawValue();
    const bit = (v === 7 || v === 9) ? 1 : 0;
    const moving = RULES.isMovingVal(v);

    // 蓄：抖动 + 占位由暗转亮
    const shake = ANIM.play(slot, [
      {transform:'translateX(0)'},    {transform:'translateX(-2.5px)'},
      {transform:'translateX(2.5px)'},{transform:'translateX(-1.5px)'},
      {transform:'translateX(1.5px)'},{transform:'translateX(0)'},
    ], {duration: DATA.DUR.charge, easing: DATA.EASE.charge, fill:'none'});
    ANIM.play(yao, [{opacity:.1}, {opacity:.4}],
      {duration: DATA.DUR.charge, easing: DATA.EASE.charge, fill:'none'});
    await ANIM.await_(shake);
    if(!ANIM.alive(epoch)) return;

    // 落：爻线归位
    delete yao.dataset.ghost;
    yao.dataset.yang = bit ? '1' : '0';
    if(moving) yao.dataset.moving = '1';
    const drop = ANIM.play(yao, [
      {opacity:0, transform:'translateY(-46px) scale(.68)'},
      {opacity:1, transform:'translateY(0) scale(1)'},
    ], {duration: DATA.DUR.drop, easing: DATA.EASE.drop});
    await ANIM.await_(drop);
    if(!ANIM.alive(epoch)) return;

    // 显：动爻持续呼吸
    if(moving){
      ANIM.play(yao.querySelector('.glow'), [{opacity:0},{opacity:.95},{opacity:.5}],
        {duration: DATA.DUR.settle + 220, easing: DATA.EASE.settle, fill:'none'});
      val.classList.add('live');
    }
    val.textContent = DATA.LINE_CN[i] + '爻 · ' + v + ' ' + DATA.VAL_NAME[v] + (moving ? ' · 动' : '');

    values.push(v); bits.push(bit); moves.push(moving);
    counter.textContent = String(i + 1);
    STORE.set({values:values.slice(), bits:bits.slice(), moves:moves.slice()});

    await ANIM.sleep(i < 5 ? 300 : 480);
    if(!ANIM.alive(epoch)) return;
  }

  FSM.goto('settle');
};

// 跳过：直接落定，不做逐爻动画
PLAYS.cast.instant = async function(){
  const values = [];
  for(let i = 0; i < 6; i++) values.push(RULES.drawValue());
  STORE.set({values, bits: RULES.bitsOfValues(values), moves: RULES.movingOfValues(values)});
  FSM.goto('settle');
};

/* --- 屏 3 · 成卦 --------------------------------------------------------- */
PLAYS.settle = async function(){
  const epoch = ANIM.cur();
  const st = STORE.state;
  if(!st.bits.length) return;

  const pair = UTIL.qs('#settle-pair');
  const nameEl = UTIL.qs('#settle-name');
  const subEl = UTIL.qs('#settle-sub');
  pair.innerHTML = '';

  const colA = document.createElement('div'); colA.className = 'col';
  colA.append(Object.assign(document.createElement('div'), {className:'cap', textContent:'本卦'}));
  const boxA = document.createElement('div'); boxA.className = 'hex-box';
  const sheen = document.createElement('div'); sheen.className = 'sheen';
  sheen.append(document.createElement('i'));
  const hexA = RENDER.stackEl(st.bits, {moves: st.moves});
  hexA.dataset.phase = 'settled';
  boxA.append(sheen, hexA);
  colA.append(boxA);
  pair.append(colA);

  const hasMove = st.moves.some(Boolean);
  const zbits = hasMove ? RULES.zhiBits(st.bits, st.moves) : null;
  let hexB = null;
  if(hasMove){
    const arrow = document.createElement('div'); arrow.className = 'arrow'; arrow.textContent = '→';
    pair.append(arrow);
    const colB = document.createElement('div'); colB.className = 'col';
    colB.append(Object.assign(document.createElement('div'), {className:'cap', textContent:'之卦'}));
    hexB = RENDER.stackEl(zbits, {});
    hexB.dataset.phase = 'settled';
    colB.append(hexB);
    pair.append(colB);
  }

  // 落定：六爻自下而上归位
  UTIL.qsa('.yao', hexA).forEach((y,i) => ANIM.play(y,
    [{opacity:0, transform:'translateY(-14px)'}, {opacity:1, transform:'translateY(0)'}],
    {duration:260, delay:i*55, easing:DATA.EASE.drop}));
  await ANIM.sleep(260 + 5*55);
  if(!ANIM.alive(epoch)) return;

  // 光泽横扫
  ANIM.play(sheen.firstElementChild,
    [{transform:'translateX(0) skewX(-18deg)'}, {transform:'translateX(420%) skewX(-18deg)'}],
    {duration:760, easing:DATA.EASE.settle, fill:'none'});

  if(hexB){
    UTIL.qsa('.yao', hexB).forEach((y,i) => ANIM.play(y, [{opacity:0},{opacity:1}],
      {duration:240, delay:330 + i*30}));
  }

  const movingNames = st.moves.map((m,i) => m ? DATA.LINE_CN[i] : null).filter(Boolean);
  nameEl.textContent = RULES.bitsToName(st.bits);
  subEl.textContent = hasMove
    ? '动爻 ' + movingNames.join('、') + ' · 之 ' + RULES.bitsToName(zbits)
    : '六爻皆静 · 无之卦';

  await ANIM.sleep(140);
  if(!ANIM.alive(epoch)) return;
  ANIM.play(nameEl, [{opacity:0, transform:'translateY(10px)'}, {opacity:1, transform:'translateY(0)'}],
    {duration:520});
  ANIM.play(subEl, [{opacity:0}, {opacity:1}], {duration:520, delay:160});
};

/* --- 屏 4 · 错综 --------------------------------------------------------- */
// 每次进入第4屏都会重建 DOM，因此把最新的重绘函数挂在这里，
// 让只绑定一次的 resize 监听器始终调用当前这一次的闭包。
let netRedraw = null;
let netResizeBound = false;
PLAYS.network = async function(){
  const epoch = ANIM.cur();
  const st = STORE.state;
  if(!st.bits.length) return;

  const variants = RULES.buildVariants(st.bits);
  STORE.set({variants});
  const bySlot = {};
  variants.forEach(v => { bySlot[v.slot] = v; });

  // 中心本卦
  const center = UTIL.qs('#center-hex');
  center.className = 'yao-stack stack';
  center.dataset.phase = 'settled';
  RENDER.fillStack(center, st.bits, {moves: st.moves});
  UTIL.qs('#center-name').textContent = RULES.bitsToName(st.bits);

  // 重合检测：回文卦（综=本卦）/ 纯卦（交=本卦）
  const seen = new Map();
  seen.set(st.bits.join(''), '本卦');
  variants.forEach(v => {
    if(v.kind === 'ben'){ v.dup = ''; return; }
    const key = v.bits.join('');
    if(seen.has(key)){ v.dup = '同' + seen.get(key); return; }
    seen.set(key, v.label);
    v.dup = '';
  });

  const cardsBox = UTIL.qs('#net-cards');
  const grid = UTIL.qs('#net-grid');
  cardsBox.innerHTML = ''; grid.innerHTML = '';

  const makeCard = v => {
    const el = document.createElement('button');
    el.className = 'card';
    el.dataset.slot = v.slot;
    el.dataset.kind = v.kind;
    if(v.dup) el.dataset.dup = '1';
    const lab = document.createElement('span'); lab.className = 'c-label';
    lab.textContent = v.kind === 'ben' ? '本卦' : v.label;
    const mini = RENDER.miniEl(v.bits);
    const nm = document.createElement('span'); nm.className = 'c-name'; nm.textContent = v.name;
    const bd = document.createElement('span'); bd.className = 'c-badge'; bd.textContent = v.dup || '';
    el.append(lab, mini, nm, bd);
    return el;
  };

  const radialEls = [];
  DATA.SLOTS.forEach(s => {
    const v = bySlot[s.slot];
    if(!v) return;
    const el = makeCard(v);
    el.style.left = s.x + '%';
    el.style.top  = s.y + '%';
    cardsBox.append(el);
    radialEls.push({el, v});
  });

  const GROUPS = [
    {title:'本卦',           kinds:['ben']},
    {title:'变卦 · 六爻之变', kinds:['bian']},
    {title:'综卦 · 颠倒',     kinds:['zong']},
    {title:'错卦 · 全反',     kinds:['cuo']},
    {title:'交卦 · 上下互换', kinds:['jiao']},
    {title:'互卦 · 去爻抽取', kinds:['hu']},
  ];
  GROUPS.forEach(g => {
    const col = document.createElement('div'); col.className = 'ncol';
    const h = document.createElement('h4'); h.textContent = g.title;
    col.append(h);
    variants.filter(v => g.kinds.indexOf(v.kind) >= 0).forEach(v => col.append(makeCard(v)));
    grid.append(col);
  });

  // ---- 连线层 ----
  const svg = UTIL.qs('#net-links');
  const stage = UTIL.qs('#net-stage');
  const wrap = UTIL.qs('.center-wrap');
  const linkMap = new Map();
  let geo = null;

  function measure(){
    const sb = stage.getBoundingClientRect();
    if(!sb.width || !sb.height) return null;
    const cb = wrap.getBoundingClientRect();
    geo = {
      sb,
      cx: cb.left - sb.left + cb.width / 2,
      cy: cb.top  - sb.top  + cb.height / 2,
      step: cb.height / 6,
    };
    svg.setAttribute('viewBox', '0 0 ' + sb.width + ' ' + sb.height);
    svg.setAttribute('width',  sb.width);
    svg.setAttribute('height', sb.height);
    return geo;
  }

  // 变卦锚到本卦对应爻的高度；其余锚到本卦中心
  function anchorFor(v){
    if(v.kind === 'bian' && v.line != null){
      return {x: geo.cx, y: geo.cy + (2.5 - v.line) * geo.step};
    }
    return {x: geo.cx, y: geo.cy};
  }

  function drawLinks(){
    if(!measure()) return;
    svg.innerHTML = '';
    linkMap.clear();
    radialEls.forEach(({el, v}) => {
      const r = el.getBoundingClientRect();
      if(!r.width) return;
      const tx = r.left - geo.sb.left + r.width / 2;
      const ty = r.top  - geo.sb.top  + r.height / 2;
      const a = anchorFor(v);
      const dx = tx - a.x, dy = ty - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const bow = .085 * len;
      const mx = (a.x + tx) / 2 - dy / len * bow;
      const my = (a.y + ty) / 2 + dx / len * bow;
      const p = document.createElementNS(SVGNS, 'path');
      p.setAttribute('d', 'M' + a.x + ',' + a.y + ' Q' + mx + ',' + my + ' ' + tx + ',' + ty);
      p.setAttribute('pathLength', '1');
      p.dataset.slot = v.slot;
      svg.append(p);
      linkMap.set(v.slot, p);
    });
  }

  drawLinks();

  // 入场：卡片放射散开
  radialEls.forEach(({el}, i) => {
    ANIM.play(el, [{opacity:0}, {opacity:1}], {duration:420, delay:i*44});
    ANIM.play(el, [
      {transform:'translate(-50%,-50%) scale(.72)'},
      {transform:'translate(-50%,-50%) scale(1)'},
    ], {duration:520, delay:i*44, easing:DATA.EASE.drop, fill:'none'});
  });
  await ANIM.sleep(420 + radialEls.length * 44);
  if(!ANIM.alive(epoch)) return;

  // 连线铺开
  let li = 0;
  linkMap.forEach(p => {
    ANIM.play(p, [{strokeDashoffset:1}, {strokeDashoffset:0}],
      {duration:420, delay:(li++)*26});
  });

  UTIL.raf(() => { if(ANIM.alive(epoch)) drawLinks(); });
  netRedraw = drawLinks;

  if(!netResizeBound){
    netResizeBound = true;
    window.addEventListener('resize', UTIL.debounce(() => {
      if(FSM.current === 'network' && !UTIL.qs('#net-stage').classList.contains('off') && netRedraw) netRedraw();
    }, 140));
  }
};

/* ==========================================================================
   EVENTS —— 输入 → FSM 指令
   ========================================================================== */
const EVENTS = (() => {
  const {qs, qsa} = UTIL;

  function bindRest(){
    const t = qs('.taiji'), ring = qs('#rest .ring');
    if(!t) return;
    const HOLD = 620;
    let timer = null, t0 = 0, rafId = 0;

    const tick = () => {
      const p = UTIL.clamp((performance.now() - t0) / HOLD, 0, 1);
      ring.style.setProperty('--p', (p * 360) + 'deg');
      if(p < 1) rafId = requestAnimationFrame(tick);
    };
    const cancel = () => {
      clearTimeout(timer); cancelAnimationFrame(rafId);
      ring.style.setProperty('--p', '0deg');
    };
    const fire = () => {
      cancel();
      if(FSM.busy) return;
      FSM.withBusy(async () => {
        STORE.reset();
        FSM.goto(STORE.state.genPlayed ? 'cast' : 'generate');
      });
    };
    const start = e => {
      if(FSM.busy || FSM.current !== 'rest') return;
      if(e.type === 'keydown'){
        if(e.key !== 'Enter' && e.key !== ' ') return;
        e.preventDefault();
      }
      t0 = performance.now();
      cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick);
      clearTimeout(timer); timer = setTimeout(fire, HOLD);
    };

    t.addEventListener('pointerdown', start);
    t.addEventListener('pointerup', cancel);
    t.addEventListener('pointerleave', cancel);
    t.addEventListener('pointercancel', cancel);
    t.addEventListener('keydown', start);
    t.addEventListener('keyup', cancel);
  }

  function bindNetwork(){
    const cardsBox = qs('#net-cards');
    const grid = qs('#net-grid');
    const center = qs('#center-hex');
    const brL = qs('#br-l'), brR = qs('#br-r');
    const links = qs('#net-links');
    let rotateAnim = null;
    let hovered = null;

    function centerWrap(){ return qs('.center-wrap'); }
    // #center-hex 本身就是 .yao-stack 容器，旋转/位移都作用在它上面
    function stackEl(){ return center; }

    function resetHover(){
      hovered = null;
      RENDER.clearHot(center);
      qsa('#net-cards .card, #net-grid .card').forEach(c => { delete c.dataset.hot; });
      qsa('path', links).forEach(p => p.classList.remove('on'));
      brL.classList.remove('on'); brR.classList.remove('on');
      if(rotateAnim){ rotateAnim.cancel(); rotateAnim = null; }
      const s = stackEl(); if(s) s.style.transform = '';
    }

    function onEnter(v, el){
      if(hovered === v.slot) return;
      resetHover();
      hovered = v.slot;
      el.dataset.hot = '1';

      const line = qsa('path', links).find(p => p.dataset.slot === v.slot);
      if(line) line.classList.add('on');

      const st = stackEl();
      switch(v.hlMode){
        case 'lines':
          RENDER.setHot(center, v.changedLines, 'hot');
          break;
        case 'all':
          RENDER.setHot(center, [0,1,2,3,4,5], 'hot');
          break;
        case 'rotate':
          if(st) rotateAnim = ANIM.reg(st.animate(
            [{transform:'rotate(0deg)'}, {transform:'rotate(180deg)'}],
            {duration: ANIM.d(DATA.DUR.rotate), easing: DATA.EASE.settle, fill:'both'}));
          break;
        case 'trigramSwap': {
          const map = {};
          for(let i = 0; i < 6; i++) map[i] = i < 3 ? 'grpA' : 'grpB';
          RENDER.hotMap(center, map);
          if(st){
            const kids = UTIL.qsa('.yao', st);
            kids.slice(0,3).forEach(y => ANIM.play(y, [
              {transform:'translateY(0)'}, {transform:'translateY(14px)'},
              {transform:'translateY(14px)'}, {transform:'translateY(0)'},
            ], {duration:760, fill:'none'}));
            kids.slice(3,6).forEach(y => ANIM.play(y, [
              {transform:'translateY(0)'}, {transform:'translateY(-14px)'},
              {transform:'translateY(-14px)'}, {transform:'translateY(0)'},
            ], {duration:760, fill:'none'}));
          }
          break;
        }
        case 'removeKept':
          RENDER.setHot(center, v.hu.removed, 'dim');
          RENDER.setHot(center, v.hu.lower.concat(v.hu.upper), 'kept');
          RENDER.setBracket(brL, v.hu.lower, true);
          RENDER.setBracket(brR, v.hu.upper, true);
          break;
        case 'none':   // 本卦自身：不高亮任何爻
          break;
        default:
          RENDER.setHot(center, [0,1,2,3,4,5], 'hot');
      }
    }

    function resolve(el){
      return STORE.state.variants.find(x => x.slot === el.dataset.slot);
    }
    function wire(box){
      if(!box) return;
      box.addEventListener('pointerover', e => {
        const el = e.target.closest('.card'); if(!el) return;
        const v = resolve(el); if(v) onEnter(v, el);
      });
      box.addEventListener('pointerout', e => {
        const el = e.target.closest('.card'); if(!el) return;
        if(el.contains(e.relatedTarget)) return;
        resetHover();
      });
      box.addEventListener('focusin', e => {
        const el = e.target.closest('.card'); if(!el) return;
        const v = resolve(el); if(v) onEnter(v, el);
      });
      box.addEventListener('focusout', resetHover);
    }
    wire(cardsBox); wire(grid);
    if(centerWrap()) centerWrap().addEventListener('pointerleave', resetHover);
  }

  function bindChrome(){
    qs('#skip').addEventListener('click', () => FSM.skip());

    qs('#to-network').addEventListener('click', () => {
      FSM.withBusy(() => { FSM.goto('network'); });
    });

    qs('#restart').addEventListener('click', () => {
      FSM.withBusy(() => { STORE.reset(); FSM.goto('rest'); });
    });

    const tv = qs('#toggle-view');
    tv.addEventListener('click', () => {
      const grouped = tv.getAttribute('aria-pressed') === 'true';
      tv.setAttribute('aria-pressed', String(!grouped));
      tv.textContent = grouped ? '分组视图' : '全铺视图';
      qs('#net-stage').classList.toggle('off', !grouped);
      qs('#net-grid').classList.toggle('on', !grouped);
      if(grouped) window.dispatchEvent(new Event('resize'));
    });

    document.addEventListener('keydown', e => {
      if(e.key === 'Escape') FSM.skip();
    });
  }

  return {bindRest, bindNetwork, bindChrome};
})();

/* ==========================================================================
   BOOT
   ========================================================================== */
(function boot(){
  EVENTS.bindRest();
  EVENTS.bindNetwork();
  EVENTS.bindChrome();
  FSM.goto('rest');

  // 调试入口：index.html?debug 打印规则自检
  window.YI = {DATA, RULES, STORE, RENDER, ANIM, FSM, PLAYS};

  if(location.search.indexOf('debug') >= 0){
    const t = (label, ok) => console.log((ok ? '✓ ' : '✗ ') + label);
    t('乾 111111 → 乾为天', RULES.bitsToName([1,1,1,1,1,1]) === '乾为天');
    t('坤 000000 → 坤为地', RULES.bitsToName([0,0,0,0,0,0]) === '坤为地');
    t('地天泰 = 7',        RULES.bitsToValue([1,1,1,0,0,0]) === 7);
    t('天地否 = 56',       RULES.bitsToValue([0,0,0,1,1,1]) === 56);
    t('水火既济',          RULES.bitsToName([1,0,1,0,1,0]) === '水火既济');
    t('山水蒙',            RULES.bitsToName([0,1,0,0,0,1]) === '山水蒙');

    const vs = RULES.buildVariants([1,0,1,0,1,0]);
    t('15 格系统', vs.length === 15);
    t('  └ 变卦 6', vs.filter(v => v.kind === 'bian').length === 6);
    t('  └ 互卦 5', vs.filter(v => v.kind === 'hu').length === 5);
    t('水火既济 · 综 → 火水未济', vs.find(v=>v.kind==='zong').name === '火水未济');
    t('水火既济 · 错 → 火水未济', vs.find(v=>v.kind==='cuo').name === '火水未济');
    const hu = vs.find(v => v.slot === 'hu-chushang');
    t('水火既济 · 互(去初上) → 火水未济', hu.name === '火水未济');

    const counts = {6:0,7:0,8:0,9:0}, N = 160000;
    for(let i = 0; i < N; i++) counts[RULES.drawValue()]++;
    t('大衍 老阴 ≈ 6.25%', Math.abs(counts[6]/N - .0625) < .005);
    t('大衍 少阳 ≈ 31.25%', Math.abs(counts[7]/N - .3125) < .006);
    t('大衍 少阴 ≈ 43.75%', Math.abs(counts[8]/N - .4375) < .006);
    t('大衍 老阳 ≈ 18.75%', Math.abs(counts[9]/N - .1875) < .005);
  }
})();
</script>
